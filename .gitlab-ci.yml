# METAGAME CI — MR 파이프라인 (docs/ci-and-notifications.md 참고)
# 잡은 모두 scripts/ci/*.py (Python 표준 라이브러리만 사용, 외부 패키지 없음)
#
# 필요한 CI/CD 변수 (Settings → CI/CD → Variables, Maintainer):
#   JIRA_USER / JIRA_API_TOKEN  : Jira **조회만** — masked. 쓰기 권한은 필요 없다(S15P21B202-242):
#                                 이슈 상태 전이는 Jira 자동화 규칙만 하고 CI 는 검사·알림만 맡는다.
#                                 **읽기 전용 스코프 토큰으로는 전환이 401 로 막힌다**(2026-09-01 실측, S15P21B202-242).
#                                 클래식 API 토큰 또는 write:jira-work 를 포함한 토큰이 필요하다
#                                 (스크립트가 api.atlassian.com/ex/jira/{JIRA_CLOUD_ID} 경로를 씀 — 사이트 URL 로는 스코프 토큰이 404)
#   GITLAB_TOKEN                : 프로젝트 액세스 토큰(api 스코프, Developer 이상) — MR 제목/본문 수정·코멘트 — masked
#   AI_REVIEW_CLI=true          : ai-review 를 러너 호스트의 로그인된 Claude Code CLI 로 실행 (채택 방식, Team 플랜) — visible
#   ANTHROPIC_API_KEY           : (대안) ai-review 를 API 로 — masked. 둘 다 없으면 ai-review 잡이 생성되지 않음
#   AI_REVIEW_MODEL / AI_REVIEW_EFFORT : (선택) 기본 claude-opus-5 / medium (팀 결정 2026-08-27)
#   MM_WEBHOOK_URL              : Mattermost 수신 웹훅 — mm-digest 용 — masked
#   CI_ENABLE=true              : 러너 등록 후 켬 — 없으면 파이프라인 자체가 생성되지 않음
#   UNITY_RUNNER=true, UNITY_PATH : Unity 설치 Windows 러너(tag unity-win) 준비 후

workflow:
  rules:
    - if: $CI_ENABLE != "true"          # 러너·변수 준비 전에는 파이프라인을 만들지 않음 (팀장이 CI_ENABLE=true 로 켬)
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # develop 머지 직후(=push) 파이프라인 — 백엔드 jar 빌드·배포가 여기서 돈다(S15P21B202-140·-141).
    # 다른 잡은 전부 merge_request_event 조건이라 생성되지 않는다. 앞으로 배포(CD)도 이 자리에 붙는다.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"

stages: [prepare, lint, test, review, deploy, notify]

default:
  # git 이 들어 있는 이미지를 쓴다(slim 에는 없다). mr-overlap·repo-hygiene·ci-tests 가 git 을 직접 부르는데,
  # 러너가 소스를 받을 때 쓰는 헬퍼 이미지는 잡 컨테이너와 별개라 체크아웃만 되고 스크립트는 깨진다
  # (2026-09-01 EC2 도커 러너 실측: FileNotFoundError: 'git' · git: not found).
  # 잡마다 apt-get install 하는 것보다 실행 시간이 짧고 결과가 결정적이다 — pull_policy if-not-present 라 최초 1회만 받는다.
  image: python:3.12
  # 모든 잡을 EC2 러너(태그 linux)로 고정한다. 두 러너가 태그 없이 돌던 동안 잡이 양쪽으로 갈려
  # ① 내 PC 를 꺼면 절반이 멈추고 ② 러너에 따라 환경이 달라졌다(-214 의 git 문제).
  # unity-compile 만 tags: [unity-win] 으로 덮어써 내 PC 로 간다.
  # EC2 장애 시: 팀장이 내 PC 러너에 linux 태그를 추가하면 즉시 예비 투입(docs/ci-and-notifications.md §4).
  tags: [linux]
  interruptible: true

variables:
  GIT_DEPTH: "0"          # repo-hygiene 가 diff base 까지 필요
  PYTHONUTF8: "1"

# ── 1단계 ────────────────────────────────────────────────────────────────
mr-title:                 # Jira 이슈 기준으로 [Part]·type·(KEY) 자동 보정. 토큰 없으면 제안만 출력
  stage: prepare
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - python scripts/ci/mr_title.py
  allow_failure: true

mm-mr-opened:             # 🟢 리뷰 요청 알림 — 이 MR 의 첫 파이프라인일 때 1회, 팀장 @멘션 (GitLab 기본 MR 알림 대체)
  stage: prepare
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $MM_WEBHOOK_URL
  script:
    - python scripts/ci/mm_notify.py mr-opened
  allow_failure: true

mr-lint:                  # 제목·브랜치·Jira 키 실존·템플릿 섹션·작성자 체크리스트
  stage: lint
  needs: [mr-title]       # 보정된 제목을 검사
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - python scripts/ci/mr_lint.py

stack-order:              # 스택 자식은 부모가 develop 에 들어간 뒤에만 머지 (S15P21B202-244)
  stage: lint             # 실측 26 대 0 으로 순서가 안 지켜졌다. mr-lint 의 경고로는 안 됐으므로 실패시킨다.
  needs: [mr-overlap]     # 둘 다 target_branch 를 쓴다 — mr-overlap 은 스택을 감지해 부모로 돌리고,
                          # stack-order 는 부모가 이미 머지됐으면 develop 으로 되돌린다. needs 가 없으면
                          # 같은 스테이지에서 동시에 돌아 서로의 결과를 못 보고 같은 필드를 덮어쓴다(-289).
  rules:                  # mm-ci-failed 의 needs 에 **일부러 넣지 않는다** — 작성자가 무엇을 잘못한 것이
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"   # 아니라 아직 순서가 아닐 뿐이라, 🔴 카드 대신
      when: always        # MR 코멘트로만 알린다. 하드 블록은 'Pipelines must succeed' 가 켜지면 생긴다.
                          # when: always 가 없으면 mr-overlap 실패 시 이 잡이 **조용히 건너뛰어진다**.
                          # only_allow_merge_if_pipeline_succeeds=false 라 빨간 파이프라인도 머지할 수
                          # 있으므로, 그 순간 순서 강제가 통째로 사라진다. 순서는 needs 가 지키고
                          # 실행은 when 이 보장한다.
  script:
    - python scripts/ci/stack_order.py

mr-overlap:               # 다른 열린 MR 과의 충돌을 MR 시점에 — 실제 3-way 머지 시험(git merge-tree), 나중 MR 이 조정
  stage: lint             # 이 MR 이 다른 MR 위에 얹혀 있으면 대상을 그 브랜치로 자동 전환(스택 MR). S15P21B202-138
  # git 이 필요하다. 기본 이미지 python:3.12-slim 에는 git 이 없어서, 이 잡이 docker
  # 러너에 잡히면 FileNotFoundError: 'git' 로 죽는다(2026-08-31 !137 에서 실측).
  # 예전에는 shell 러너가 가져가 호스트의 git 을 썼고 slim 이어도 돌았다 — 러너가 하나
  # 늘면 다시 갈린다. 이미지를 full 로 지정하면 docker 에서는 git 이 있고, shell
  # 러너에서는 image 가 무시되므로 양쪽 다 돈다.
  image: python:3.12
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - python scripts/ci/mr_overlap.py

ci-tests:                 # scripts/ci 오프라인 테스트 — 네트워크·토큰 없이 도는 회귀 검사
  stage: lint             # CI 스크립트를 고칠 때 + 매일 스케줄에서 돈다
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "scripts/ci/**/*"
    # 코드가 안 바뀌어도 **시간이 흘러** 깨지는 것을 잡는다. -281 이 그랬다: 픽스처의 merged_at 이
    # 08-27 고정인데 검사 창이 now-7일이라 09-03 17:06 KST 에 저절로 깨졌고, 그 뒤 scripts/ci 를
    # 건드린 MR 이 없어 아무도 못 봤다. 매일 09:30 스케줄에서 돌면 09:33 카드가 나가기 전에 드러난다.
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - python scripts/ci/tests/run_all.py

repo-hygiene:             # 금지 파일·.meta 짝·에셋 위치·대용량 비-LFS·씬/프리팹 선언 일치
  stage: lint
  # git 이 필요하다. 기본 이미지 python:3.12-slim 에는 git 이 없어서, 이 잡이 docker
  # 러너에 잡히면 FileNotFoundError: 'git' 로 죽는다(2026-08-31 !137 에서 실측).
  # 예전에는 shell 러너가 가져가 호스트의 git 을 썼고 slim 이어도 돌았다 — 러너가 하나
  # 늘면 다시 갈린다. 이미지를 full 로 지정하면 docker 에서는 git 이 있고, shell
  # 러너에서는 image 가 무시되므로 양쪽 다 돈다.
  image: python:3.12
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    # 배포 스풀 격리 회귀 검사(-252). MR 잡은 공용 러너에서 돌고, 거기에는 스풀이 없어야 한다.
    # 보이면 공용 러너 config.toml 에 마운트가 되살아난 것이고, 그 순간 아무 MR 이나
    # 자기 브랜치의 .gitlab-ci.yml 에 한 줄 넣어 배포를 쏠 수 있게 된다.
    - |
      if [ -e /spool ]; then
        echo "❌ MR 잡에서 /spool 이 보인다 — 배포 스풀 격리(S15P21B202-252)가 깨졌다."
        echo "   EC2 /etc/gitlab-runner/config.toml 의 **공용 러너** volumes 에서 스풀 마운트를 제거하고"
        echo "   systemctl restart gitlab-runner. 배포 러너(METAGAME-deploy-…)의 것은 그대로 둔다."
        exit 1
      fi
      echo "✅ 스풀 격리 유지 — MR 잡에서 /spool 안 보임"
    - python scripts/ci/repo_hygiene.py

# ── 2단계 ────────────────────────────────────────────────────────────────
unity-compile:            # Unity 설치 Windows 러너에서만. UNITY_RUNNER=true 로 켬
  stage: test
  tags: [unity-win]
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $UNITY_RUNNER == "true"
  allow_failure: true     # 안정화 후 false 로
  script:
    - '& "$env:UNITY_PATH" -batchmode -nographics -projectPath METAGAME -runTests -testPlatform EditMode -testResults "$env:CI_PROJECT_DIR\unity-results.xml" -logFile "$env:CI_PROJECT_DIR\unity.log"'
    - 'if ($LASTEXITCODE -ne 0) { Get-Content "$env:CI_PROJECT_DIR\unity.log" | Select-String -Pattern "error CS|Exception" | Select-Object -First 40; exit $LASTEXITCODE }'
  artifacts:
    when: always
    paths: [unity-results.xml, unity.log]
    reports:
      junit: unity-results.xml

build-backend:            # 백엔드 jar — MR 에서는 컴파일 검사, develop 머지에서는 배포용 산출물 (S15P21B202-140)
  stage: test             # 지금까지 백엔드는 MR 시점 빌드 검사가 아예 없었다
  image: eclipse-temurin:17-jdk    # 프로젝트는 Java 17 · Gradle 9.7.1 래퍼
  tags: [linux]           # 이미지가 필요한 잡이므로 도커 러너를 못 박는다 — 셸 러너(내 PC)로 가면
                          # image 가 무시되고 chmod 도 없어 실패한다(2026-09-01 실측: 파이프라인 176688)
  needs: []
  rules:                  # .gitlab-ci.yml 이 바뀔 때도 돌린다 — 이 잡 자체가 여전히 도는지 확인하려고
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["backend/**/*", ".gitlab-ci.yml"]
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
      changes: ["backend/**/*", ".gitlab-ci.yml"]
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"   # 캐시가 잡 밖으로 남으려면 작업 디렉터리 안이어야 한다
  cache:
    key: gradle-backend
    paths: [".gradle/caches/modules-2", ".gradle/wrapper"]
  script:
    - cd backend
    - chmod +x ./gradlew            # git 에 실행 권한이 없다(mode 100644)
    - ./gradlew --no-daemon bootJar
  artifacts:
    name: "backend-jar-$CI_COMMIT_SHORT_SHA"
    paths: ["backend/build/libs/*.jar"]
    expire_in: 3 days     # 60MB — 배포(-141)가 쓸 만큼만 남긴다

ai-review:                # 비차단. API 키(ANTHROPIC_API_KEY) 또는 러너 호스트의 로그인된 Claude Code CLI(AI_REVIEW_CLI=true) 중 하나 있을 때 생성
  stage: review           # 문서(docs/**, *.md)만 바뀐 MR 은 건너뜀 — 구독 사용량 절약, 문서는 팀장 리뷰로 충분
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($ANTHROPIC_API_KEY || $AI_REVIEW_CLI == "true")
      changes:
        - "METAGAME/**/*"
        - "scripts/**/*"
        - ".gitlab-ci.yml"
        - ".gitlab/**/*"
        - ".githooks/**/*"
        - ".gitattributes"
        - ".gitignore"
  allow_failure: true
  script:
    - python scripts/ci/ai_review.py

# ── 배포 ─────────────────────────────────────────────────────────────────
deploy-backend:           # develop 머지 뒤 **사람이 눌러서** 배포 (S15P21B202-141)
  stage: deploy           # 잡은 컨테이너 안이라 호스트 compose 를 못 부른다 → 스풀에 jar+RELEASE 를 놓고
  image: python:3.12      # 호스트의 systemd path 유닛이 deploy.sh 를 돌린다(도커 소켓 비노출, -139 결정)
  tags: [deploy]          # 배포 전용 러너(태그 deploy · Protected). 스풀은 이제 여기에만 마운트된다.
                          # 공용 러너에 스풀이 있던 동안에는 아무 MR 이나 자기 브랜치의 .gitlab-ci.yml 에
                          # /spool 에 쓰는 잡을 한 줄 넣어 배포를 쏠 수 있었다(S15P21B202-252).
                          # 나머지 잡은 default.tags: [linux] 라 이 러너로 오지 않는다.
  needs: [build-backend]
  interruptible: false    # 배포 도중 취소되면 반쯤 적용된 상태가 남는다
  rules:
    # 왜 manual 인가: 팀원이 이 서버로 테스트 중이고 재시작은 WebSocket 세션을 전부 끊는다.
    # 머지가 하루 28건인 날도 있어 자동 재시작이면 테스트가 불가능하다. 자동으로 바꾸려면 이 줄을 지운다.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
      changes: ["backend/**/*"]
      when: manual
  script:
    - python scripts/ci/deploy_backend.py

# ── 알림 ─────────────────────────────────────────────────────────────────
mm-ci-failed:             # 🔴 CI 실패 알림 — mr-lint/repo-hygiene/mr-overlap 실패 시 MR 작성자 @멘션 + 실패 잡 링크
  stage: notify
  needs:
    - job: mr-lint
    - job: repo-hygiene
    - job: ci-tests
      optional: true      # CI 스크립트를 건드리지 않은 MR 에는 이 잡이 없다
    - job: mr-overlap
  when: on_failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $MM_WEBHOOK_URL
  script:
    - python scripts/ci/mm_notify.py ci-failed
  allow_failure: true

mm-ci-resolved:           # 검사 통과 시, 남아 있는 CI 실패 코멘트를 '해소됨' 으로 갱신 (S15P21B202-102)
  stage: notify
  needs:                  # mm-ci-failed 와 **같은 목록**이어야 한다. 달랐을 때는 ci-tests·mr-overlap 이
    - job: mr-lint        # 실패해도 '해소됨' 이 찍혔고, 같은 파이프라인에서 🔴 와 ✅ 가 같은 마커에
    - job: repo-hygiene   # 동시에 써서 결과가 비결정적이었다(-289). 실패한 잡이 needs 에 있으면
    - job: ci-tests       # when: on_success 가 알아서 이 잡을 건너뛴다.
      optional: true      # CI 스크립트를 건드리지 않은 MR 에는 이 잡이 없다
    - job: mr-overlap
  when: on_success
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - python scripts/ci/mm_notify.py ci-resolved
  allow_failure: true

mm-digest:                # 스케줄 파이프라인(매일 09:30 · 실제 발송 09:33) — needs-fix·오래 열린 MR·정체 이슈 요약을 MM 채널로
  stage: notify
  needs:                  # ci-tests 를 **기다리되 결과에 매이지 않는다**. needs 가 없으면 lint 가
    - job: ci-tests       # 빨간 순간 이 잡이 건너뛰어져 아침 카드가 아예 안 나간다(-289).
      optional: true      # when: always 라 ci-tests 가 실패해도 카드는 나가고, 실패 사실을 카드가 싣는다.
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $MM_WEBHOOK_URL
      when: always
  script:
    - python scripts/ci/mm_digest.py
