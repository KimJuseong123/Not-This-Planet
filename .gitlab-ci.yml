# METAGAME CI — MR 파이프라인 (docs/ci-and-notifications.md 참고)
# 잡은 모두 scripts/ci/*.py (Python 표준 라이브러리만 사용, 외부 패키지 없음)
#
# 필요한 CI/CD 변수 (Settings → CI/CD → Variables, Maintainer):
#   JIRA_USER / JIRA_API_TOKEN  : Jira **조회만** — masked. 쓰기 권한은 필요 없다(S15P21B202-242):
#                                 이슈 상태 전이는 Jira 자동화 규칙만 하고 CI 는 검사·알림만 맡는다.
#                                 **읽기 전용 스코프 토큰으로는 전환이 401 로 막힌다**(2026-09-01 실측, S15P21B202-242).
#                                 클래식 API 토큰 또는 write:jira-work 를 포함한 토큰이 필요하다
#                                 (스크립트가 api.atlassian.com/ex/jira/{JIRA_CLOUD_ID} 경로를 씀 — 사이트 URL 로는 스코프 토큰이 404)
#   GITLAB_TOKEN                : 프로젝트 액세스 토큰(api 스코프, Developer 이상) — MR 제목/본문 수정·코멘트 — masked
#   AI_REVIEW_CLI=true          : ai-review 를 러너 호스트의 로그인된 Claude Code CLI 로 실행 (채택 방식, Team 플랜) — visible
#   ANTHROPIC_API_KEY           : (대안) ai-review 를 API 로 — masked. 둘 다 없으면 ai-review 잡이 생성되지 않음
#   AI_REVIEW_MODEL / AI_REVIEW_EFFORT : (선택) 기본 claude-opus-5 / medium (팀 결정 2026-08-27)
#   MM_WEBHOOK_URL              : Mattermost 수신 웹훅 — mm-digest 용 — masked
#   JIRA_RELEASE_WEBHOOK        : (선택, S15P21B202-327) Jira 자동화 수신 웹훅 — 릴리스 뒤 버전·이슈 목록을 보낸다 — masked·protected
#   DEVBUILD_TRIGGER_TOKEN      : 파이프라인 트리거 토큰 — MR 의 qa 빌드를 develop 파이프라인으로 넘겨 배치시킨다 (S15P21B202-582).
#                                 **masked · Protected 는 끈다.** MR 파이프라인은 보호 ref 가 아니라서 Protected 변수가
#                                 전달되지 않는다 — 걸어 두면 토큰이 빈 문자열로 들어와 배치가 조용히 안 된다.
#                                 대신 workflow.rules 가 트리거를 `develop` + `$STAGE_VERSION` 일 때만 받아 범위를 좁힌다.
#                                 Maintainer 가 Settings → CI/CD → Pipeline trigger tokens 에서 한 번 만든다.
#   CI_ENABLE=true              : 러너 등록 후 켬 — 없으면 파이프라인 자체가 생성되지 않음

workflow:
  rules:
    - if: $CI_ENABLE != "true"          # 러너·변수 준비 전에는 파이프라인을 만들지 않음 (팀장이 CI_ENABLE=true 로 켬)
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_PIPELINE_SOURCE == "schedule"
    # develop 머지 직후(=push) 파이프라인 — 백엔드 jar 빌드·배포가 여기서 돈다(S15P21B202-140·-141).
    # 다른 잡은 전부 merge_request_event 조건이라 생성되지 않는다. 앞으로 배포(CD)도 이 자리에 붙는다.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
      # **뒤따라오는 머지가 이 파이프라인을 죽이지 못하게 한다** (S15P21B202-309).
      # 09-06 19:43 에 -303(릴레이)이 머지돼 build-backend + deploy-backend 가 생겼는데,
      # 1분 뒤 -304 가 머지되면서 GitLab 이 앞 파이프라인을 자동 취소했다. default.interruptible
      # 이 true 라 아직 시작 안 한 build-backend 가 취소 대상이었다. 그런데 -304 는 backend/ 를
      # 건드리지 않아 **새 파이프라인에는 백엔드 잡이 아예 없었다** — 누를 배포 버튼이 사라졌고,
      # 파이프라인은 초록이라 아무도 몰랐다. 백엔드는 이틀 전 것으로 계속 돌았다.
      # MR 파이프라인은 그대로 둔다 — 거기서는 새 push 가 앞 것을 죽이는 게 맞다.
      auto_cancel:
        on_new_commit: none
    # master 머지 = 릴리스 (S15P21B202-326). release-windows 가 빌드·패키지·Release 를 만든다.
    # 릴리스 도중 다른 머지가 이 파이프라인을 죽이면 반쯤 올라간 패키지가 남으므로 여기도 자동 취소 없음.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"
      auto_cancel:
        on_new_commit: none
    # 릴리스 리허설 (S15P21B202-407). Pipelines -> Run pipeline 으로 도는 파이프라인이다.
    #
    # **이 줄이 없어서 리허설이 아예 만들어지지 않았다.** release-windows 에 `web` 조건을
    # 넣어 두었지만 이 목록은 catch-all 이 없는 화이트리스트라, web 은 아무 항목에도
    # 걸리지 않아 파이프라인 자체가 생성되지 않았다 — 잡 규칙은 닿지도 않는 죽은 코드였다.
    # "Run pipeline 을 눌렀는데 아무것도 안 보인다" 가 그것이다(2026-09-11 확인).
    #
    # 자동 취소를 끄는 이유는 master 와 같다 — 90분짜리 빌드가 중간에 죽으면 반쯤 만든
    # 산출물이 남고, 리허설의 목적(경로가 끝까지 가는지 본다)이 성립하지 않는다.
    - if: $CI_PIPELINE_SOURCE == "web"
      auto_cancel:
        on_new_commit: none
    # **qa 빌드 배치 하나만을 위한 길** (S15P21B202-582). MR 의 `build-devbuild` 가
    # 끝나면서 `trigger_stage.py` 로 이 파이프라인을 만든다 — 배포 러너가 `ref_protected`
    # 라 MR ref 의 잡을 집지 않기 때문이다(`-405` 실측).
    #
    # **세 조건을 다 본다.** 토큰은 MR 파이프라인에서 읽혀야 하므로 Protected 를 걸 수
    # 없고, 그러면 아무 브랜치의 잡이 그 값을 쓸 수 있다. 그래서 그 토큰으로 할 수 있는
    # 일을 여기서 좁힌다 — `develop` 이 아니거나 `STAGE_VERSION` 이 없으면 **파이프라인
    # 자체가 만들어지지 않는다.** 만들어져도 `publish-devbuild` 말고는 걸리는 rules 가
    # 없다(다른 잡은 전부 merge_request_event·push·schedule·web 을 못 박는다).
    - if: $CI_PIPELINE_SOURCE == "trigger" && $CI_COMMIT_BRANCH == "develop" && $STAGE_VERSION
      auto_cancel:
        on_new_commit: none

stages: [prepare, lint, test, review, deploy, notify]

default:
  # git 이 들어 있는 이미지를 쓴다(slim 에는 없다). mr-overlap·repo-hygiene·ci-tests 가 git 을 직접 부르는데,
  # 러너가 소스를 받을 때 쓰는 헬퍼 이미지는 잡 컨테이너와 별개라 체크아웃만 되고 스크립트는 깨진다
  # (2026-09-01 EC2 도커 러너 실측: FileNotFoundError: 'git' · git: not found).
  # 잡마다 apt-get install 하는 것보다 실행 시간이 짧고 결과가 결정적이다 — pull_policy if-not-present 라 최초 1회만 받는다.
  image: python:3.12
  # 모든 잡을 EC2 러너(태그 linux)로 고정한다. 두 러너가 태그 없이 돌던 동안 잡이 양쪽으로 갈려
  # ① 내 PC 를 꺼면 절반이 멈추고 ② 러너에 따라 환경이 달라졌다(-214 의 git 문제).
  # unity-compile 도 여기서 돈다 — image 로 Unity 이미지를 쓰고 tags 는 linux 다(-271).
  # 예전 주석은 "tags: [unity-win] 으로 덮어써 내 PC 로 간다" 였는데 그 덮어쓰기는 없어졌다.
  # EC2 장애 시: 팀장이 내 PC 러너에 linux 태그를 추가하면 즉시 예비 투입(docs/ci-and-notifications.md §4).
  tags: [linux]
  interruptible: true

variables:
  GIT_DEPTH: "0"          # repo-hygiene 가 diff base 까지 필요
  PYTHONUTF8: "1"
  # Unity 의 Library(2.2GB)를 잡 사이에 남긴다 — 콜드 임포트가 7분 30초인데 증분이면 훨씬 짧다.
  # **전역이어야 한다**: 도커 실행기의 빌드 디렉터리는 그 슬롯의 **모든 잡이 공유**하므로,
  # unity-compile 에만 예외를 주면 다음에 그 슬롯에서 도는 mr-lint 가 예외 없는
  # git clean -ffdx 로 Library 를 지운다(2026-09-02 실측: 슬롯 2개 중 1개만 남았다).
  # 다른 잡에는 무해하다 — Library 는 .gitignore 대상이고 검사들은 git diff 로만 판단한다.
  GIT_CLEAN_FLAGS: -ffdx -e METAGAME/Library

# ── 1단계 ────────────────────────────────────────────────────────────────
mr-title:                 # Jira 이슈 기준으로 [Part]·type·(KEY) 자동 보정. 토큰 없으면 제안만 출력
  stage: prepare
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - python scripts/ci/mr_title.py
  allow_failure: true

retarget-pipelines:       # 결함 ① — 부모 브랜치가 지워져 자동 재대상된 자식 MR 에 파이프라인을 만든다
  stage: prepare          # GitLab 은 그때 파이프라인을 **만들지 않는다**(09-02~04 재대상 16건 중 14건).
  needs: []               # 그러면 자식에 남은 마지막 결과가 **부모 위에서 돈 것**인데 초록으로 보이고,
  rules:                  # 팀장이 그 초록을 믿고 머지한다. GitLab #381622 · #559008 (S15P21B202-295)
    # 재대상이 일어나는 시점 — 부모가 develop 에 머지된 직후
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
    # 안전망. develop push 파이프라인이 실패·취소된 날에도 다음 아침에 메운다
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: always
  allow_failure: true     # 이 잡이 실패해도 머지·배포를 막을 이유가 없다. 다음 실행에서 다시 본다
  script:
    - python scripts/ci/retarget_pipeline.py

mm-mr-opened:             # 🟢 리뷰 요청 알림 — 이 MR 의 첫 파이프라인일 때 1회, 팀장 @멘션 (GitLab 기본 MR 알림 대체)
  stage: prepare
  needs: [mr-title]       # 보정된 제목을 카드에 싣는다. needs: [] 였을 때는 mr-title 과 동시에 돌아 카드에
                          # GitLab 기본 제목(S15p21b202 321 ci cd map)이 실렸다(S15P21B202-322).
                          # mr-title 은 allow_failure 라 실패해도 이 잡은 돈다.
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $MM_WEBHOOK_URL
  script:
    - python scripts/ci/mm_notify.py mr-opened
  allow_failure: true

mr-lint:                  # 제목·브랜치·Jira 키 실존·템플릿 섹션·작성자 체크리스트
  stage: lint
  needs: [mr-title]       # 보정된 제목을 검사
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - python scripts/ci/mr_lint.py

stack-order:              # 스택 자식은 부모가 develop 에 들어간 뒤에만 머지 (S15P21B202-244)
  stage: lint             # 실측 26 대 0 으로 순서가 안 지켜졌다. mr-lint 의 경고로는 안 됐으므로 실패시킨다.
  needs: [mr-overlap]     # 둘 다 target_branch 를 쓴다 — mr-overlap 은 스택을 감지해 부모로 돌리고,
                          # stack-order 는 부모가 이미 머지됐으면 develop 으로 되돌린다. needs 가 없으면
                          # 같은 스테이지에서 동시에 돌아 서로의 결과를 못 보고 같은 필드를 덮어쓴다(-289).
  rules:                  # mm-ci-failed 의 needs 에 **일부러 넣지 않는다** — 작성자가 무엇을 잘못한 것이
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"   # 아니라 아직 순서가 아닐 뿐이라, 🔴 카드 대신
      when: always        # MR 코멘트로만 알린다. 하드 블록은 'Pipelines must succeed' 가 켜지면 생긴다.
                          # when: always 가 없으면 mr-overlap 실패 시 이 잡이 **조용히 건너뛰어진다**.
                          # only_allow_merge_if_pipeline_succeeds=false 라 빨간 파이프라인도 머지할 수
                          # 있으므로, 그 순간 순서 강제가 통째로 사라진다. 순서는 needs 가 지키고
                          # 실행은 when 이 보장한다.
  script:
    - python scripts/ci/stack_order.py

mr-overlap:               # 다른 열린 MR 과의 충돌을 MR 시점에 — 실제 3-way 머지 시험(git merge-tree), 나중 MR 이 조정
  stage: lint             # 이 MR 이 다른 MR 위에 얹혀 있으면 대상을 그 브랜치로 자동 전환(스택 MR). S15P21B202-138
  # git 이 필요하다. 기본 이미지 python:3.12-slim 에는 git 이 없어서, 이 잡이 docker
  # 러너에 잡히면 FileNotFoundError: 'git' 로 죽는다(2026-08-31 !137 에서 실측).
  # 예전에는 shell 러너가 가져가 호스트의 git 을 썼고 slim 이어도 돌았다 — 러너가 하나
  # 늘면 다시 갈린다. 이미지를 full 로 지정하면 docker 에서는 git 이 있고, shell
  # 러너에서는 image 가 무시되므로 양쪽 다 돈다.
  image: python:3.12
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - python scripts/ci/mr_overlap.py

ci-tests:                 # scripts/ci 오프라인 테스트 — 네트워크·토큰 없이 도는 회귀 검사
  stage: lint             # CI 스크립트를 고칠 때 + 매일 스케줄에서 돈다
  needs: []
  rules:
    # **`changes:` 를 두지 않는다** (S15P21B202-632). 예전에는 `scripts/ci/**` 뿐이었는데,
    # 이 안의 검사들은 **저장소를 읽는다.** 그래서 읽는 대상만 바꾼 MR 에서는 그 검사가
    # 아예 돌지 않았다:
    #   · `test_scene_cleanup.py`      — `Tests/Editor` 의 C#(씬을 연 검증이 닫는가)
    #   · `test_scene_backend_urls.py` — 모든 `.unity`·`.prefab`(씬에 서버 주소가 박혔는가)
    #   · `test_unity_reuse.py`        — `Tests/Editor`
    #   · `test_ai_review_paths.py`    — `git ls-files` 전부
    #
    # `-614` 는 검증 파일만 고쳐 머지됐고, 그래서 씬 정리 가드가 **한 번도 안 돌았다.**
    # 머지 뒤 develop 에서 씬이 새어 뒤이은 검증 3건이 흔들렸다. 더 위험한 쪽은 씬이다 —
    # `-584`(한 실행이 두 환경을 봤다)를 막는 검사인데, 씬만 바꾼 MR 에서는 안 돌았다.
    #
    # **목록으로 막지 않는다.** "넣을 것" 목록은 잊으면 조용히 빠진다 — 방금 그렇게 됐고,
    # `test_ai_review_paths.py` 가 존재하는 이유도 그것이다. 게다가 정직하게 적으면
    # `METAGAME/Assets/**/*` 까지 와서 "항상" 과 거의 같아진다.
    #
    # **값**: 실측 32.5초(잡 577933) · `needs: []` · lint 스테이지의 파이썬 잡이라 Unity
    # 러너를 쓰지 않는다 — `repo-hygiene` 과 같은 무게다. 더 드는 것은 Unity 를 아예
    # 안 건드리는 MR 에서의 32초뿐이다.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # 코드가 안 바뀌어도 **시간이 흘러** 깨지는 것을 잡는다. -281 이 그랬다: 픽스처의 merged_at 이
    # 08-27 고정인데 검사 창이 now-7일이라 09-03 17:06 KST 에 저절로 깨졌고, 그 뒤 scripts/ci 를
    # 건드린 MR 이 없어 아무도 못 봤다. 매일 09:30 스케줄에서 돌면 09:33 카드가 나가기 전에 드러난다.
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - python scripts/ci/tests/run_all.py

repo-hygiene:             # 금지 파일·.meta 짝·에셋 위치·대용량 비-LFS·씬/프리팹 선언 일치
  stage: lint
  # git 이 필요하다. 기본 이미지 python:3.12-slim 에는 git 이 없어서, 이 잡이 docker
  # 러너에 잡히면 FileNotFoundError: 'git' 로 죽는다(2026-08-31 !137 에서 실측).
  # 예전에는 shell 러너가 가져가 호스트의 git 을 썼고 slim 이어도 돌았다 — 러너가 하나
  # 늘면 다시 갈린다. 이미지를 full 로 지정하면 docker 에서는 git 이 있고, shell
  # 러너에서는 image 가 무시되므로 양쪽 다 돈다.
  image: python:3.12
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    # 배포 스풀 격리 회귀 검사(-252). MR 잡은 공용 러너에서 돌고, 거기에는 스풀이 없어야 한다.
    # 보이면 공용 러너 config.toml 에 마운트가 되살아난 것이고, 그 순간 아무 MR 이나
    # 자기 브랜치의 .gitlab-ci.yml 에 한 줄 넣어 배포를 쏠 수 있게 된다.
    - |
      if [ -e /spool ]; then
        echo "❌ MR 잡에서 /spool 이 보인다 — 배포 스풀 격리(S15P21B202-252)가 깨졌다."
        echo "   EC2 /etc/gitlab-runner/config.toml 의 **공용 러너** volumes 에서 스풀 마운트를 제거하고"
        echo "   systemctl restart gitlab-runner. 배포 러너(METAGAME-deploy-…)의 것은 그대로 둔다."
        exit 1
      fi
      echo "✅ 스풀 격리 유지 — MR 잡에서 /spool 안 보임"
    - python scripts/ci/repo_hygiene.py

# ── 2단계 ────────────────────────────────────────────────────────────────
unity-compile:            # Unity C# 컴파일 + EditMode 테스트 — EC2 도커 러너 (S15P21B202-271)
  # changes 게이트는 **빌드에 영향 있는 폴더만** 본다 (S15P21B202-420).
  #
  # 예전에는 `METAGAME/**/*` 였다. 그래서 `METAGAME/README.md` 나 `METAGAME/Docs/` 의
  # 문서만 고쳐도 Unity 임포트·컴파일·테스트가 한 번 돌았다(콜드 임포트 7분 30초).
  # Unity 빌드에 들어가는 것은 `Assets/`·`Packages/`·`ProjectSettings/` 뿐이고,
  # `Docs/`·`BlenderSource/`·`Tools/`·`Screenshots/`·`README.md` 는 프로젝트 밖이다.
  #
  # 남는 것 하나: `Assets/` 아래의 `.md`(예: `Models/README_KO.md`)는 여전히 돈다.
  # 그것까지 빼려면 부정 패턴이 필요한데 GitLab `rules:changes` 에는 없다.
  stage: test             # 이 잡이 없던 동안 검사가 0건이었다: CI 이력 잡 2,583건 중 unity-compile 0건.
  # GameCI 이미지에 에디터·xvfb·라이선스 클라이언트가 다 들어 있다. 태그는 프로젝트 버전과 같아야 한다
  # (다르면 batchmode 가 프로젝트를 조용히 업그레이드한다) — METAGAME/ProjectSettings/ProjectVersion.txt 와 맞춘다.
  image: unityci/editor:ubuntu-6000.5.4f1-base-3.2.2
  tags: [linux]
  needs: []
  rules:
    # 자동 실행한다.
    #
    # **실측(2026-09-17, 잡 564663 · 6.0분)** — 어디에 시간이 가는지:
    #   체크아웃·develop 합치기   3초
    #   에셋 임포트              36초   ← 이미 웜이다(`GIT_CLEAN_FLAGS` 의 Library 예외)
    #   도메인 리로드 8회·시작/종료 35초
    #   **EditMode 테스트       275초**  ← 여기다 (1795건)
    #
    # 예전 주석은 "콜드 8분 16초 → 웜 70초(임포트 64초 + 테스트 20초)" 였다(2026-09-02).
    # 그 뒤 테스트가 1795건으로 늘어 **테스트가 임포트의 7배**가 됐다. 낡은 수치를 두면
    # 다음 사람이 임포트를 줄이려고 엉뚱한 곳을 판다. 슬롯이 비워지면 임포트는 다시
    # 8분이 든다(그 부분은 그대로다).
    #
    # 1795건 중 **5초 이상인 21건이 테스트 시간의 71%(195초)** 를 먹는다 — 그래서
    # 아래 script 에서 MR 일 때만 `-testCategory "!Heavy"` 로 뺀다 (S15P21B202-602).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["METAGAME/Assets/**/*", "METAGAME/Packages/**/*", "METAGAME/ProjectSettings/**/*", ".gitlab-ci.yml"]
    # 머지 직후에도 돈다 — 개별 MR 은 통과했는데 합쳐서 깨지는 경우를 잡는다.
    # 09-02 사고는 감지까지 2시간 37분이 걸렸다(그 사이 develop 머지 0건). 이 규칙이면 2분이다.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
      # 여기에는 `.gitlab-ci.yml` 을 넣지 않는다 — 위 MR 규칙에 이미 있어서 **머지 전에**
      # 이 잡 정의로 한 번 돈다. 여기서 또 보면 CI 만 고친 MR 이 머지될 때마다 Unity 가
      # 한 번 더 돌고, 4 vCPU 를 게임 서버와 나눠 쓰는 EC2 라 실유저 응답이 느려진다.
      changes: ["METAGAME/Assets/**/*", "METAGAME/Packages/**/*", "METAGAME/ProjectSettings/**/*"]
  # 종료 코드로 판정을 나눈다 (S15P21B202-309). unity_report.py 가 **대상 브랜치 기준선과
  # 비교해서** 정한다:
  #   0 = 통과(기존 실패만 있음) · 1 = **이 MR 이 만든** 컴파일 오류·새 테스트 실패 → 막는다
  #   2 = 기준선 없음·라이선스 만료 등 판단 불가 → ⚠ 경고만
  # 전에는 allow_failure: true 였고 잡이 Unity 의 원시 종료 코드(테스트가 하나라도 실패하면 2)를
  # 그대로 뱉었다. 그래서 신호가 **양쪽으로 다 틀렸다**:
  #   · 기존 실패 25건뿐인 MR 세 건(!228·!229·!230)에 전부 빨간 ⚠ 가 붙었고 — 코멘트는
  #     "새로 생긴 것 0" 이라고 정확히 적고 있었는데도 그랬다
  #   · 반대로 컴파일이 깨져도 비차단이라 머지가 됐다. 09-02 에 develop 이 2시간 37분 멈춘 그 경로다.
  variables:
    # 플래키 재실행 (S15P21B202-347). **값은 여기 한 곳에만 둔다** — 파이썬 쪽에 같은
    # 상수를 두면 한쪽만 바뀌어 아티팩트 목록과 어긋난다(`!272` AI 리뷰).
    RECHECK_RUNS: "2"          # 새 실패를 그 테스트만 골라 몇 번 다시 돌리는가
    RECHECK_MAX_NEW: "30"      # 이보다 많으면 플래키가 아니다 — 재실행을 건너뛴다
  allow_failure:
    exit_codes: [2]       # 2(판단 불가)만 비차단. 1 은 실제로 막는다.
  timeout: 90m
  # 동시에 두 개가 돌지 않게 한다. 러너가 concurrent 2 · vCPU 4 인데 Unity 임포트는 CPU·IO 를
  # 다 쓴다 — 두 개가 겹치면 서로 느려지고 가벼운 검사들이 굶는다.
  resource_group: unity
  script:
    # 라이선스는 CI 변수가 아니라 러너 마운트로 온다(config.toml volumes). 환경변수가 아니라서
    # 로그로 새어나갈 경로가 없고, MR 이 보호 브랜치가 아니어서 Protected 변수를 못 읽는 문제도 피한다.
    - LIC=/root/.local/share/unity3d/Unity/Unity_lic.ulf
    - |
      if [ ! -s "$LIC" ]; then
        echo "❌ Unity 라이선스가 마운트되지 않았다: $LIC"
        echo "   EC2 러너 config.toml 의 volumes 에 아래가 있어야 한다 (S15P21B202-271):"
        echo "   /home/ubuntu/unity-license/Unity_lic.ulf:/root/.local/share/unity3d/Unity/Unity_lic.ulf:ro"
        exit 1
      fi
    # 만료를 미리 알린다 — 이 .ulf 는 time-limited 엔타이틀먼트다(갱신: --update-ulf).
    - CLIENT=/opt/unity/Editor/Data/Resources/Licensing/Client/Unity.Licensing.Client
    - '"$CLIENT" --showEntitlements 2>&1 | grep -E "Product Name|Expiration Date|com.unity.editor.headless" || true'
    # ── 대상 브랜치를 합친 결과에서 검사한다 (S15P21B202-342) ──────────────────
    # GitLab 의 MR 파이프라인은 `refs/merge-requests/N/head` — **소스 브랜치 끝**에서 돈다.
    # develop 과 합친 결과에서 도는 merged results pipeline 은 Premium 이다. 그래서 서로를
    # 못 본 두 MR 이 **각자 초록인데 합치면 빨간** 의미 충돌이 그대로 지나간다.
    # 2026-09-08 실측: -331 이 발사 실패 테스트 7건을 추가하고(799→806) 바로 뒤 -339 가
    # 1Stage 행성 중력값을 바꿨다. -339 의 MR 이 마지막으로 돈 시점 그 브랜치에는 그 7건이
    # 없었으므로 판정 0(통과)이었고, develop 에 얹히자마자 3건이 깨졌다
    # (FallImpactTests.JumpApexIsBelowTheStaggerThreshold: 점프 최고점 2.06m 기대 → 1.16m).
    # mr-overlap 은 git merge-tree 로 **텍스트 충돌**만 본다 — 이건 파일이 겹치지 않는다.
    # 여기서 직접 합쳐 그 결과를 검사한다. 같은 잡 안이라 추가 비용이 없고, 기준선 비교의
    # 의미도 정확해진다 — '합친 결과의 실패' 와 '대상 브랜치의 실패' 를 견주게 된다.
    - |
      T="$CI_MERGE_REQUEST_TARGET_BRANCH_NAME"
      if [ -n "$T" ]; then
        # refspec 을 **명시한다**. 러너는 `Created fresh repository` 뒤 MR ref 만 가져오므로
        # (2026-09-08 트레이스 실측) `remote.origin.fetch` 에 기대면 origin/develop 이 없다.
        # stderr 를 버리는 이유: origin URL 에 잡 토큰이 박혀 있어 실패 메시지로 샐 수 있다.
        git fetch --no-tags --quiet origin "+refs/heads/$T:refs/remotes/origin/$T" 2>/dev/null || true
        if ! git rev-parse --verify --quiet "origin/$T" >/dev/null; then
          # 대상 브랜치를 못 가져왔다. 브랜치 끝에서만 검사한다 — 오늘까지의 동작과
          # 같으므로 신호가 나빠지지는 않는다.
          echo "⚠ origin/$T 를 가져오지 못했다 — 브랜치 끝에서만 검사한다"
        elif git -c user.email=ci@metagame -c user.name="GitLab CI" merge --no-edit "origin/$T"; then
          export UNITY_MERGED_BASE="$(git rev-parse --short "origin/$T")"
          echo "✅ origin/$T ($UNITY_MERGED_BASE) 를 합친 결과에서 검사한다"
        else
          # 충돌이면 GitLab 이 이미 '머지할 수 없음' 으로 막고 mr-overlap 이 자세히 알린다.
          # 여기서 회귀로 단정하지 않는다 — 워크트리를 되돌리고 브랜치 끝에서 검사한다.
          #
          # **되돌리기 실패를 삼키지 않는다.** abort 가 실패하면 워크트리에 충돌 마커가
          # 남은 채 Unity 가 돌고, 그 마커는 이 MR 이 바꾼 파일에 있으므로 근거 없는
          # 컴파일 오류로 차단된다(`!259` AI 리뷰 지적). 그래서 abort 가 안 되면
          # MR 커밋으로 하드 리셋하고, 그것도 안 되면 검사를 아예 하지 않는다.
          git merge --abort 2>/dev/null             || git reset --hard "$CI_COMMIT_SHA" >/dev/null 2>&1             || true
          if [ -n "$(git ls-files -u 2>/dev/null)" ]; then
            echo "❌ 워크트리에 충돌이 남았다 — 이 상태의 검사 결과는 신뢰할 수 없다"
            # **조용히 끝내지 않는다.** 판정 2 는 비차단이라 파이프라인이 초록인데 코멘트가
            # 없으면 "문서만 바뀌어 잡이 안 돌았다" 와 구분되지 않는다 — 이 MR 이 없애려던
            # 침묵과 같은 모양이다(`!259` 5차 AI 리뷰). 보고 스크립트가 사유를 코멘트로 남긴다.
            export UNITY_ABORTED="대상 브랜치를 합치다 충돌이 남아 워크트리를 되돌리지 못했다"
            python3 scripts/ci/unity_report.py "$CI_PROJECT_DIR/unity-results.xml"                                                "$CI_PROJECT_DIR/unity.log" 2 || true
            exit 2
          fi
          # 원인을 갈라 적는다. 얕은 클론이면 공통 조상이 없어 '관련 없는 히스토리' 로 떨어지는데,
          # 그건 충돌과 대처가 다르다(전역 GIT_DEPTH: "0" 을 누가 바꾼 것이다).
          if [ -z "$(git merge-base HEAD "origin/$T" 2>/dev/null)" ]; then
            echo "⚠ origin/$T 와 공통 조상이 없다 — 얕은 클론이다. 전역 GIT_DEPTH 를 0 으로 두어야 한다"
          else
            echo "⚠ origin/$T 와 충돌 — 브랜치 끝에서만 검사한다(합친 결과는 검사하지 못했다)"
          fi
        fi
      fi
    # ── 같은 것을 두 번 검사하지 않는다 (S15P21B202-602) ───────────────────────
    #
    # MR 파이프라인의 `rules:changes` 는 **대상 브랜치와의 차이**를 보므로, 브랜치에
    # Unity 변경이 한 번 쌓이면 그 뒤 push 가 문서만 고쳐도 여기가 다시 돈다.
    # 2026-09-17 실측: 이어진 재실행 15건 중 7건이 Unity 무변경이었다(`565396` 7.8분 ·
    # 같은 커밋 재시도 `565473` 4.4분). 직렬화돼 있어 그 시간이 남의 대기 시간이 된다.
    #
    # **합친 base 를 남긴다** — 다음 실행이 "그때 무엇과 합쳐 검사했나" 를 알아야
    # 재사용 여부를 판단할 수 있다. 아래 판단이 이 파일을 읽는다.
    - echo "${UNITY_MERGED_BASE:-}" > "$CI_PROJECT_DIR/unity-base.txt"
    # **검사 대상 트리의 지문을 남긴다** (S15P21B202-642). 머지가 끝난 **뒤**라야
    # `HEAD` 가 실제로 검사할 트리다. 이 파일이 있어야 다른 ref 의 잡이 "같은 것을
    # 이미 검사했다" 를 알 수 있다 — 지금은 `release-windows` 가 그것을 쓴다.
    - python3 scripts/ci/unity_reuse.py key || true
    - python3 scripts/ci/unity_reuse.py || true
    # unity-editor 래퍼가 xvfb-run 과 -batchmode 를 붙여 준다(이미지 실측) — 여기서 또 주지 않는다.
    # -nographics 도 주지 않는다: xvfb 가 있어 URP 셰이더 관련 임포트가 정상적으로 돈다.
    - |
      if [ -s "$CI_PROJECT_DIR/unity-reused.txt" ]; then
        export UNITY_REUSED_FROM="$(cat "$CI_PROJECT_DIR/unity-reused.txt")"
        echo "=== Unity 를 건너뛴다 — 잡 $UNITY_REUSED_FROM 의 결과를 그대로 쓴다 ==="
        echo "    검사 대상이 바이트 단위로 같다(브랜치·develop 둘 다 Unity 입력 무변경)."
      else
        # **무거운 21건은 MR 에서 빼고 develop 에서 돈다** (S15P21B202-602).
        # 1795건 중 5초 이상인 21건이 테스트 시간 275초의 71%(195초)를 먹는다.
        # 머지 직후 실행(`-309`)이 그 21건을 전부 돌리므로 회귀는 2분 안에 잡힌다.
        # 되돌리려면 이 `-testCategory` 를 빼면 된다.
        if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
          set -- -testCategory "!Heavy"
          # 코멘트에 "덜 돌았다" 를 적게 한다 — 안 적으면 초록이 '전부 돌았다' 로 읽힌다.
          export UNITY_SKIPPED_CATEGORY="Heavy"
          echo "=== 임포트 + 컴파일 + EditMode 테스트 시작 (Heavy 제외) ==="
        else
          set --
          echo "=== 임포트 + 컴파일 + EditMode 테스트 시작 (전체) ==="
        fi
        date -u +"시작 %H:%M:%S UTC"
        set +e
        unity-editor \
          -projectPath METAGAME \
          -runTests -testPlatform EditMode "$@" \
          -testResults "$CI_PROJECT_DIR/unity-results.xml" \
          -logFile "$CI_PROJECT_DIR/unity.log"
        RC=$?
        set -e
        date -u +"종료 %H:%M:%S UTC (exit $RC)"
        echo "$RC" > "$CI_PROJECT_DIR/unity-rc.txt"
      fi
    # 결과를 MR 에서 보이게 한다 (S15P21B202-271):
    #   · NUnit3 → JUnit 변환. Unity 형식을 GitLab 이 못 읽어 reports: junit 이 **조용히 0건**이었다
    #     (2026-09-02 실측: test_report_summary total 0). 변환하면 MR 테스트 위젯이 살아난다
    #   · 대상 브랜치의 마지막 결과와 비교해 **이 MR 이 만든 실패만** 코멘트로 남긴다.
    #     기존 실패(현재 17개)는 담당자가 고치는 중이라 나열하지 않는다 — 매번 나열하면 읽지 않게 된다
    #   · 컴파일이 깨졌으면 error CS 줄을 코멘트 맨 위에 싣는다
    # 새 실패가 있으면 **그 테스트만 골라 다시 돌린다** (S15P21B202-347).
    #
    # 판정("기준선에 없던 실패는 이 MR 탓")은 실행이 결정적이라는 것을 전제한다. 물리
    # 시뮬레이션 테스트 몇 개가 경계에 앉아 있어 그 전제가 깨져 있다 — 2026-09-09 에 같은
    # 커밋으로 4회 돌려 4회 다 실패했는데 기준선은 통과였고, MR 3건이 동시에 막혔다.
    # 한 번이라도 통과하면 같은 코드로 결과가 갈린 것이므로 이 MR 탓이 아니다.
    #
    # 새 실패가 없으면 이 단계는 아무것도 하지 않는다 — 평소 비용 0이다.
    - |
      PLAN="$CI_PROJECT_DIR/unity-recheck.txt"
      # **지난 실행이 남긴 것을 먼저 지운다**(`!272` AI 리뷰). 최종 판정이 이 디렉터리에서
      # unity-recheck-*.xml 을 글롭으로 모으므로, 워크스페이스가 재사용되면 **이번에 재실행
      # 하지 않았는데도 옛 통과 기록으로 새 실패가 면제될 수 있다.** GIT_CLEAN_FLAGS 가
      # 보통 지우지만 그 보장을 여기에 두는 것이 맞다.
      rm -f "$CI_PROJECT_DIR"/unity-recheck-*.xml "$CI_PROJECT_DIR"/unity-recheck-*.log \
            "$PLAN" "$CI_PROJECT_DIR/unity-baseline.json" \
            "$CI_PROJECT_DIR/unity-recheck-filter.txt"
      # 계획 단계는 기준선을 조회해 `unity-baseline.json` 에 **고정해 둔다.** 최종 판정이
      # 그것을 그대로 읽으므로, 그 사이 develop 의 unity-compile 이 끝나도 재실행한 집합과
      # 판정 대상이 어긋나지 않는다(`!272` AI 리뷰).
      python3 scripts/ci/unity_report.py "$CI_PROJECT_DIR/unity-results.xml" \
        "$CI_PROJECT_DIR/unity.log" "$(cat "$CI_PROJECT_DIR/unity-rc.txt")" \
        --recheck-plan "$PLAN" || true
      # `[ -s "$PLAN" ] && N=…` 로 써도 set -e 가 끊지 않는다(&& 목록의 마지막이 아닌
      # 실패는 면제된다 — 2026-09-09 실측). 그래도 읽는 사람에게 애매해서 if 로 둔다.
      N=0
      if [ -s "$PLAN" ]; then N=$(grep -c . "$PLAN" || true); fi
      # 변수가 빈 값·비숫자로 덮이면 `[: integer expression expected` 로 셸이 죽고,
      # set -e 하에서 **판정 경로에 닿기도 전에 잡이 실패한다**(`!272` 4차 AI 리뷰).
      # 파이프라인 변수는 누구나 덮을 수 있으므로 기본값으로 받고 숫자인지 본다.
      MAXN=${RECHECK_MAX_NEW:-30}
      RUNS=${RECHECK_RUNS:-2}
      case "$MAXN" in ''|*[!0-9]*) echo "RECHECK_MAX_NEW='$MAXN' 이 숫자가 아니다 — 30 을 쓴다"; MAXN=30;; esac
      case "$RUNS" in ''|*[!0-9]*) echo "RECHECK_RUNS='$RUNS' 이 숫자가 아니다 — 2 를 쓴다"; RUNS=2;; esac
      # 상한을 넘으면 재실행하지 않는다 — 그 정도면 플래키가 아니라 실제 회귀이고,
      # -testFilter 명령줄만 길어진다. **건너뛴 사실을 로그에 적는다.**
      if [ "$N" -gt "$MAXN" ]; then
        echo "새 실패 ${N}건 — ${MAXN}건을 넘어 재실행을 건너뛴다(플래키로 볼 규모가 아니다)"
      elif [ "$N" -gt 0 ]; then
        # 필터 값은 unity_report.py 가 만들어 뒀다 — `-testFilter` 는 이름을 **정규식으로**
        # 해석하므로 파라미터화 이름(`Load(1,2)`)을 그대로 넘기면 매칭에 실패한다.
        # 이스케이프를 셸 sed 로 하면 백슬래시가 몇 겹 먹히는지 애매해서 파이썬에 뒀다.
        #
        # **구분자(;)가 이 Unity 버전에서 안 통하면** 재실행 결과에 대상 이름이 하나도
        # 없고, unity_report.py 가 `[warn] ... -testFilter 가 이름을 못 잡은 것으로
        # 보인다` 를 찍는다. 그 줄이 보이면 콤마 구분으로 바꿔야 한다.
        F=$(cat "$CI_PROJECT_DIR/unity-recheck-filter.txt")
        echo "새 실패 ${N}건 — 그 테스트만 골라 ${RUNS}회 다시 돌린다"
        for i in $(seq 1 "$RUNS"); do
          set +e
          unity-editor \
            -projectPath METAGAME \
            -runTests -testPlatform EditMode \
            -testFilter "$F" \
            -testResults "$CI_PROJECT_DIR/unity-recheck-$i.xml" \
            -logFile "$CI_PROJECT_DIR/unity-recheck-$i.log"
          echo "재실행 $i 종료 $?"
          set -e
          # 결과가 없으면 그 회차는 판별에 못 쓴다. unity_report.py 는 결과에 이름이
          # 없는 것을 **회귀로 둔다** — 확인 못 한 것을 면제하지 않는다.
          [ -s "$CI_PROJECT_DIR/unity-recheck-$i.xml" ] \
            || echo "재실행 $i 결과 없음 — 이 회차는 판별에 쓰지 않는다"
        done
      fi
    # 이미지에 python3 3.10 이 있다(실측). 잡이 실패로 끝나도 보고는 남아야 하므로 exit 앞에 둔다.
    # 재실행 결과는 **디렉터리로 넘긴다** — 셸이 인자를 이어 붙이면 경로에 공백이 섞였을 때
    # 조용히 깨져 면제가 사라진다(`!272` AI 리뷰).
    - python3 scripts/ci/unity_report.py "$CI_PROJECT_DIR/unity-results.xml" "$CI_PROJECT_DIR/unity.log" "$(cat "$CI_PROJECT_DIR/unity-rc.txt")" --recheck-dir "$CI_PROJECT_DIR" --baseline-from "$CI_PROJECT_DIR/unity-baseline.json"
    # 판정은 unity_report.py 가 파일로 남긴다. 보고 자체가 죽어 파일이 없으면 2(경고)로 끝낸다 —
    # **판정하지 못한 것을 회귀로 단정하지 않는다.** Unity 원시 코드로 되돌아가면 기존 실패에
    # 다시 걸린다.
    - |
      V="$CI_PROJECT_DIR/unity-verdict.txt"
      if [ -s "$V" ]; then RC=$(cat "$V"); else echo "⚠ 판정 파일이 없다 — 보고 스크립트가 죽었다"; RC=2; fi
      echo "unity-compile 종료 $RC (0 통과 · 1 이 MR 이 만든 문제 · 2 판단 불가)"
      exit "$RC"
  artifacts:
    when: always
    # 기준선(대상 브랜치의 마지막 결과)을 이 아티팩트에서 읽는다. unity-compile 은
    # changes: METAGAME/** 게이트라 문서·스크립트만 머지되는 날에는 develop 에 아예 생기지
    # 않는다 — 3일이면 그 사이 만료되어 기준선이 사라지고, 판정이 2(판단 불가)로 떨어져
    # **새 실패가 그대로 통과한다**(비차단). 14일이면 그 구멍이 실질적으로 닫힌다.
    # 용량: 4개 합쳐 MR 당 ~3MB 라 5배 늘려도 부담이 없다 (S15P21B202-342).
    expire_in: 14 days
    # unity-recheck-* 는 플래키 판별 근거다 (S15P21B202-347) — 판정을 다시 볼 때 필요하다.
    # 기준선으로 읽히는 것은 unity-results.xml 하나뿐이므로 재실행 결과가 섞이지 않는다.
    # **글롭으로 둔다** — RECHECK_RUNS 를 바꿔도 목록을 함께 고칠 필요가 없다.
    # `unity-base.txt`·`unity-rc.txt` 는 **다음 실행이 재사용을 판단할 때** 읽는다
    # (S15P21B202-602). base 가 없으면 "그때 무엇과 합쳐 검사했는지" 를 알 수 없어
    # 재사용하지 않는다 — 이 파일이 빠지면 최적화가 조용히 꺼진다.
    paths: [unity-results.xml, unity-junit.xml, unity.log, unity-verdict.txt,
            unity-recheck.txt, unity-baseline.json, unity-base.txt, unity-rc.txt,
            unity-key.txt,
            unity-reused.txt,
            unity-recheck-*.xml, unity-recheck-*.log]
    reports:
      # Unity 가 낸 NUnit3 가 아니라 변환한 JUnit 을 올린다 — 전자는 GitLab 이 0건으로 읽는다.
      junit: unity-junit.xml

build-backend:            # 백엔드 **테스트 + jar** — MR 에서는 검사, develop 머지에서는 배포용 산출물
  stage: test             # 처음에는 컴파일 검사만 있었다(-140). 테스트 58개는 CI 에서 한 번도
                          # 돌지 않았는데, 켤 수 없던 이유가 플래키였다 — 2026-09-04 실측에서
                          # 같은 명령 3회가 매번 다른 테스트를 떨어뜨렸다. 원인은
                          # GameWebSocketIntegrationTest 의 헬퍼가 찾던 타입이 아닌 메시지를
                          # 버려서 뒤의 await 가 굶는 것이었고(-302), 고친 뒤 EC2 도커 러너에서
                          # **10회 연속 통과**(파이프라인 186069)를 확인하고 켰다.
  image: eclipse-temurin:17-jdk    # 프로젝트는 Java 17 · Gradle 9.7.1 래퍼
  tags: [linux]           # 이미지가 필요한 잡이므로 도커 러너를 못 박는다 — 셸 러너(내 PC)로 가면
                          # image 가 무시되고 chmod 도 없어 실패한다(2026-09-01 실측: 파이프라인 176688)
  needs: []
  rules:                  # .gitlab-ci.yml 이 바뀔 때도 돌린다 — 이 잡 자체가 여전히 도는지 확인하려고
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes: ["backend/**/*", ".gitlab-ci.yml"]
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
      changes: ["backend/**/*", ".gitlab-ci.yml"]
    # **master 에서는 changes 를 보지 않는다** (S15P21B202-284).
    #
    # 릴리스는 "이 트리의 백엔드" 를 올릴 수 있어야 한다. `changes` 를 걸면 backend/ 가
    # 안 바뀐 릴리스에서 이 잡이 안 생기고, 그러면 `needs: [build-backend]` 인
    # deploy-prod 도 생성되지 않아 **누를 버튼이 사라진다** — `-309` 가 겪은 그 실패
    # 방식이다(잡 두 개의 조건이 어긋나 build 만 생기는 조합이 만들어졌다).
    #
    # 비용은 릴리스마다 2분 30초 한 번이다. 버튼이 사라지는 것보다 싸다.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"
    # **서버만 고쳐야 할 때** (S15P21B202-464). Run pipeline 에서 ref 를 `master` 로
    # 두고 `DEPLOY_PROD=1` 을 주면 이 잡이 jar 을 만들고 `deploy-prod` 버튼이 생긴다.
    # 이것이 없으면 `deploy-prod` 의 `needs` 가 없는 잡을 가리켜 **파이프라인 생성이
    # 거절된다** — `-467` 이 `release-prod` 에서 겪은 것과 같은 자리다.
    # `$DEPLOY_PROD` 만 쓰면 **있기만 하면 참**이라 `DEPLOY_PROD=0` 에도 걸린다
    # (`!379` 리뷰). 끄려고 0 을 넣은 사람이 켜는 결과를 얻는다.
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "master" && $DEPLOY_PROD == "1"
    # 새벽 배포 스케줄에서도 돌아야 한다 — `deploy-dev` 가 이 잡의 jar 을 쓴다
    # (`needs: [build-backend]`). 아침 점검 스케줄에는 이 변수가 없어 생기지 않는다.
    - if: $CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_DEPLOY_DEV == "true"
  variables:
    GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"   # 캐시가 잡 밖으로 남으려면 작업 디렉터리 안이어야 한다
  cache:
    key: gradle-backend
    paths: [".gradle/caches/modules-2", ".gradle/wrapper"]
  script:
    - cd backend
    - chmod +x ./gradlew            # git 에 실행 권한이 없다(mode 100644)
    - ./gradlew --no-daemon test bootJar
  artifacts:
    when: always          # 테스트가 깨져도 junit 리포트는 올린다 — 그것이 없으면 GitLab 이
                          # 어느 테스트가 깨졌는지 못 보여 주고 사람이 로그를 뒤져야 한다.
                          # 대가: 테스트가 깨지면 bootJar 가 안 돌아 아래 *.jar 가 없고
                          # "no matching files" 경고가 남는다. 잡 결과는 바뀌지 않고,
                          # 그 경우 사람이 볼 것은 어차피 테스트 실패다. 잡을 둘로 쪼개면
                          # Gradle 이 두 번 돌아 잡 시간이 배가 된다 — 경고 한 줄이 더 싸다
    name: "backend-jar-$CI_COMMIT_SHORT_SHA"
    paths: ["backend/build/libs/*.jar"]
    reports:              # MR 위젯에 **이 MR 이 새로 깨뜨린 테스트만** 뜬다.
                          # unity-compile 이 NUnit3 → JUnit 변환을 하는 것과 같은 이유(-271)
      junit: ["backend/build/test-results/test/*.xml"]
    expire_in: 3 days     # 60MB — 배포(-141)가 쓸 만큼만 남긴다

ai-review:                # 비차단. API 키(ANTHROPIC_API_KEY) 또는 러너 호스트의 로그인된 Claude Code CLI(AI_REVIEW_CLI=true) 중 하나 있을 때 생성
  stage: review           # 문서(docs/**, *.md)만 바뀐 MR 은 건너뜀 — 구독 사용량 절약, 문서는 팀장 리뷰로 충분
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($ANTHROPIC_API_KEY || $AI_REVIEW_CLI == "true")
      changes:
        - "METAGAME/**/*"
        - "scripts/**/*"
        # **뒤에 생긴 세 곳이 빠져 있었다** (S15P21B202-544). 이 목록은 *문서를 빼려고*
        # 만든 것인데 `backend/`·`launcher/`·`website/` 가 그 뒤에 생겨 **적는 것을
        # 잊은 채로** 지나갔다. 머지된 `!418`(백엔드)·`!421`·`!443`(런처)에 리뷰
        # 코멘트가 0건이고, `ai-review-gate` 도 안 생겨 ⛔ 로 막힐 길이 없었다.
        #
        # 하필 사람에게 가장 가까운 둘이다 — 런처는 사용자 PC 의 exe 를 갈아 끼우고
        # (`-507`), 백엔드는 적용하면 **세션이 끊긴다**(그래서 배포가 버튼이다).
        - "backend/**/*"
        - "launcher/**/*"
        # 미디어가 대부분이지만 `release.js`·`release-config.js` 가 사용자가 내려받는
        # 화면을 그린다 — 그것이 틀리면 아무도 게임을 못 받는다.
        - "website/**/*"
        # 에셋을 만드는 파이썬이 산다. 손으로 돌리는 것이지만 그 결과물이 빌드에 실린다.
        - "tools/**/*"
        - ".gitlab-ci.yml"
        - ".gitlab/**/*"
        - ".githooks/**/*"
        - ".gitattributes"
        - ".gitignore"
  allow_failure: true
  script:
    - python scripts/ci/ai_review.py

ai-review-gate:           # ⛔ 보류 권고면 **막는다**. ⚠️·✅·❓ 는 통과 (S15P21B202-341)
  stage: review           # ai-review 는 allow_failure 그대로 남긴다 — 리뷰를 '돌리는' 실패와
                          # 그 결과로 '막는' 것은 성격이 다르고, 되돌리기가 이 잡 지우기로 끝나야 한다.
  needs:
    - job: ai-review      # ai-review 가 **실패해도 이 잡은 돈다** — 2026-09-09 파이프라인 186028 에서
      optional: true      # 실측했다(allow_failure: true 로 exit 1 한 잡을 needs 로 가리킨 잡이
                          # success 로 실행됐다). needs 실패가 후속 잡을 skip 시킨다는 통설과 달라
                          # 임시 잡 두 개로 직접 쟀다. optional 은 rules 가 어긋나 ai-review 가
                          # 아예 없는 파이프라인에서 파이프라인 생성이 깨지지 않게 하는 보험이다.
  rules:                  # **ai-review 와 같은 조건이어야 한다** — 리뷰가 없는 파이프라인에서
                          # 게이트만 돌면 매번 "코멘트가 없다" 경고가 나간다.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && ($ANTHROPIC_API_KEY || $AI_REVIEW_CLI == "true")
      changes:
        - "METAGAME/**/*"
        - "scripts/**/*"
        # **뒤에 생긴 세 곳이 빠져 있었다** (S15P21B202-544). 이 목록은 *문서를 빼려고*
        # 만든 것인데 `backend/`·`launcher/`·`website/` 가 그 뒤에 생겨 **적는 것을
        # 잊은 채로** 지나갔다. 머지된 `!418`(백엔드)·`!421`·`!443`(런처)에 리뷰
        # 코멘트가 0건이고, `ai-review-gate` 도 안 생겨 ⛔ 로 막힐 길이 없었다.
        #
        # 하필 사람에게 가장 가까운 둘이다 — 런처는 사용자 PC 의 exe 를 갈아 끼우고
        # (`-507`), 백엔드는 적용하면 **세션이 끊긴다**(그래서 배포가 버튼이다).
        - "backend/**/*"
        - "launcher/**/*"
        # 미디어가 대부분이지만 `release.js`·`release-config.js` 가 사용자가 내려받는
        # 화면을 그린다 — 그것이 틀리면 아무도 게임을 못 받는다.
        - "website/**/*"
        # 에셋을 만드는 파이썬이 산다. 손으로 돌리는 것이지만 그 결과물이 빌드에 실린다.
        - "tools/**/*"
        - ".gitlab-ci.yml"
        - ".gitlab/**/*"
        - ".githooks/**/*"
        - ".gitattributes"
        - ".gitignore"
  script:
    - python scripts/ci/ai_review_gate.py

# ── 배포 ─────────────────────────────────────────────────────────────────
# 배포 대상이 **둘**이다 (S15P21B202-284). 예전에는 `deploy-backend` 하나가 develop 을
# 받아 실유저가 쓰는 백엔드에 올렸다 — 그래서 develop 머지마다 재시작이 WebSocket 세션을
# 끊었고, 그것이 배포를 수동으로 둔 이유였다. 서버를 나눈 뒤에는 그 이유가 dev 에만
# 해당하지 않게 된다: dev 는 자동, prod 는 수동이다.
deploy-dev:               # develop 머지 뒤 **자동** 배포 — 개발 서버 (S15P21B202-284)
  stage: deploy           # 잡은 컨테이너 안이라 호스트 compose 를 못 부른다 → 스풀에 jar+RELEASE 를 놓고
  image: python:3.12      # 호스트의 systemd path 유닛이 deploy.sh 를 돌린다(도커 소켓 비노출, -139 결정)
  tags: [deploy]          # 배포 전용 러너(태그 deploy · Protected · ref_protected).
                          # 공용 러너에 스풀이 있던 동안에는 아무 MR 이나 자기 브랜치의 .gitlab-ci.yml 에
                          # /spool 에 쓰는 잡을 한 줄 넣어 배포를 쏠 수 있었다(S15P21B202-252).
  needs: [build-backend]
  interruptible: false    # 배포 도중 취소되면 반쯤 적용된 상태가 남는다.
                          # 그것만으로는 부족해 workflow 쪽에서 auto_cancel 도 껐다(-309).
  environment:
    name: development
    url: https://j15b202.p.ssafy.io/dev
  variables:
    # **dev 스풀이다.** prod 스풀(`/spool`)과 다른 자리를 봐야 develop 머지가 실유저
    # 백엔드를 건드리지 않는다 — 나누는 목적이 그것이다.
    DEPLOY_SPOOL: /spool-dev
  rules:
    # **머지는 버튼만 만든다** (S15P21B202-455).
    #
    # 한때 여기에 "나눈 뒤 실유저는 prod 에 있으니 자동으로 해도 된다" 고 적혀
    # 있었다. **그 논리가 틀렸다.** `-139` §4 가 수동으로 둔 이유는 실유저가 아니라
    # **이 서버로 테스트하는 팀원**이었다 — 재시작은 약 7초인데 그 사이 WebSocket
    # 세션이 전부 끊긴다. dev 가 바로 그 팀원이 쓰는 서버다. 자동으로 두면 낮에
    # 백엔드 MR 이 머지될 때마다 테스트하던 사람이 튕긴다.
    #
    # 급할 때는 사람이 "지금 끊어도 된다" 를 알고 누른다. 평소 최신 맞추기는
    # 아래 새벽 스케줄이 한다.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
      # `.gitlab-ci.yml` 을 넣는 이유 두 가지 (S15P21B202-309):
      #   ① 배포 정의가 바뀌었으면 그것을 실제로 배포해 볼 수 있어야 한다
      #   ② build-backend 가 이미 이 조건이라 **잡 두 개의 조건이 어긋나면** deploy 는
      #      needs: [build-backend] 이므로 build 만 생기는 조합이 만들어진다
      changes: ["backend/**/*", ".gitlab-ci.yml"]
      when: manual
    # **새벽 스케줄은 자동이다.** 아침에 오면 개발 서버가 최신이고, 그 시간에는
    # 끊길 세션이 없다. `changes` 를 보지 않는다 — 어제 무엇이 머지됐든 맞춘다.
    - if: $CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_DEPLOY_DEV == "true"
  script:
    - python scripts/ci/deploy_backend.py

deploy-prod:              # 릴리스 뒤 **사람이 눌러서** 배포 — 배포 서버 (S15P21B202-284)
  stage: deploy
  image: python:3.12
  tags: [deploy]
  # 같은 파이프라인의 build-backend 가 만든 jar 을 받는다. master 에서는 그 잡이
  # changes 를 보지 않으므로(위 주석) 릴리스마다 반드시 존재한다.
  needs: [build-backend]
  interruptible: false
  environment:
    name: production
    url: https://j15b202.p.ssafy.io
  rules:
    # **릴리스 파이프라인에는 이 버튼을 두지 않는다** (S15P21B202-592). 거기서는
    # `release-prod` 가 백엔드 배포까지 맡는다. 버튼이 나란히 둘이면 "둘 다 눌러야 하나"
    # 가 되고, 실제로 v1.1.0 에서 한쪽만 눌려 **배포 백엔드가 나흘째 뒤처져 있었다.**
    #
    # 아래 `web` 길만 남긴다 — 설정 한 줄 고치자고 릴리스를 새로 낼 수는 없다.
    # **서버만 고치는 길** (S15P21B202-464).
    #
    # `master` 머지는 **빌드 릴리스**이지 서버 배포가 아니다 — 이 버튼을 눌러야 배포
    # 백엔드가 바뀐다. 그런데 그 버튼은 **릴리스 파이프라인에만** 있었다. 그래서 서버
    # 코드만 고쳐야 할 때(설정 한 줄·보안 수정) **90분짜리 Unity 빌드를 다시 태우는 것
    # 말고는 길이 없었다.**
    #
    # 이 규칙은 그 길을 연다: Pipelines → Run pipeline → ref `master` · `DEPLOY_PROD=1`.
    # 그 파이프라인에서는 `release-windows` 가 돌지 않는다(아래 참고).
    #
    # **여전히 수동이다.** prod 재시작은 진행 중인 세션을 끊는다 — 여는 것은 "릴리스를
    # 안 거쳐도 된다" 이지 "아무 때나 끊어도 된다" 가 아니다.
    #
    # master 는 보호 브랜치라 이 파이프라인을 돌릴 수 있는 사람도 거기에 머지할 수
    # 있는 사람뿐이다. 권한이 한 겹 더 필요하지 않다.
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "master" && $DEPLOY_PROD == "1"
      when: manual
  script:
    # 스풀은 기본값(`/spool`)이다 — dev 와 달리 DEPLOY_SPOOL 을 주지 않는다.
    - python scripts/ci/deploy_backend.py

# ── 릴리스 ───────────────────────────────────────────────────────────────────
release-windows:          # master 머지 = 릴리스. Windows 빌드 → zip → 패키지 레지스트리 → GitLab Release(태그) → MM (S15P21B202-326)
  stage: deploy           # 팀장이 하는 일은 release/<키>-vX.Y.Z 브랜치를 master 에 머지하는 것까지다(git-convention §8).
  # 컴파일 검사와 같은 GameCI 이미지 계열 — 이쪽은 Windows 플레이어를 만드는 windows-mono 모듈이 든 것.
  # 태그는 프로젝트 버전과 같아야 한다(다르면 batchmode 가 프로젝트를 조용히 업그레이드한다).
  image: unityci/editor:ubuntu-6000.5.4f1-windows-mono-3.2.2
  tags: [linux]
  needs: []
  resource_group: unity   # unity-compile 과 같은 그룹 — Unity 두 개가 겹치면 서로 느려지고 가벼운 검사가 굶는다
  timeout: 90m
  interruptible: false
  rules:
    # **서버만 배포하는 파이프라인에서는 돌지 않는다** (S15P21B202-464). `DEPLOY_PROD`
    # 는 `deploy-prod` 하나만 쓰는 변수다. 이것이 없으면 서버 설정 한 줄을 고치는 데
    # **90분짜리 Unity 빌드**가 딸려 돌고, 그러면 이 길을 낸 이유가 사라진다.
    #
    # **브랜치와 값까지 본다** (`!379` 리뷰). 처음에는 `web && $DEPLOY_PROD` 뿐이었는데,
    # 그러면 **아무 브랜치의 리허설**에서도 그 변수가 있으면 90분 빌드가 통째로 사라진다 —
    # 리허설은 "릴리스 전에 안다" 가 목적이라 조용히 안 도는 것이 가장 나쁜 실패다.
    # 아래 두 잡(build-backend·deploy-prod)이 master 를 못 박고 있으니 조건도 맞춘다.
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "master" && $DEPLOY_PROD == "1"
      when: never
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"
    # **리허설** (S15P21B202-407 ④). 트리거가 master push 하나뿐이라 시험 실행이 곧 실제
    # 릴리스였다 — 90분 잡을 미검증 상태로 처음 돌리게 된다. GitLab 의 "파이프라인 실행"
    # (Pipelines → Run pipeline)으로 아무 브랜치에서나 돌리면 RELEASE_DRY_RUN=1 이 되어
    # 빌드·zip 까지 진짜로 하고 **패키지 업로드·Release 생성·🟢 카드만 건너뛴다.**
    # **되돌리기 파이프라인에서는 돌지 않는다** (S15P21B202-467). `PROMOTE_VERSION` 은
    # `release-prod` 하나만 쓰는 변수다. 이것이 없으면 latest.json 한 줄 되돌리자고
    # **90분짜리 Unity 빌드**가 딸려 돌고, `release-prod` 는 그 90분을 기다린다 —
    # 되돌리기는 급할 때 쓰는 길이라 그 시간이 곧 장애 시간이다.
    # 브랜치까지 본다 — 같은 이유다(`!379` 리뷰). `-467` 이 이 규칙을 넣을 때는
    # 조건이 `web && $PROMOTE_VERSION` 뿐이었고, 그러면 아무 브랜치의 리허설에서도
    # 그 변수만 있으면 90분 빌드가 조용히 사라진다.
    - if: $CI_PIPELINE_SOURCE == "web" && $CI_COMMIT_BRANCH == "master" && $PROMOTE_VERSION
      when: never
    - if: $CI_PIPELINE_SOURCE == "web"
      variables:
        RELEASE_DRY_RUN: "1"
  variables:
    # SpaceBuild 의 출력 폴더. METAGAME/ 밖(리포 루트 아래)이라 위생 검사·.gitignore 와 무관하고,
    # 다음 잡의 git clean 이 지운다(GIT_CLEAN_FLAGS 의 예외는 Library 만).
    SPACE_BUILD_DIR: "$CI_PROJECT_DIR/release/NotThisPlanet"
  script:
    - LIC=/root/.local/share/unity3d/Unity/Unity_lic.ulf
    - |
      if [ ! -s "$LIC" ]; then
        echo "❌ Unity 라이선스가 마운트되지 않았다: $LIC (S15P21B202-271)"; exit 1
      fi
    # 1) 버전을 먼저 정한다 — 못 정하면 빌드(수 분) 전에 멈춘다. 머지 커밋의 release/…-vX.Y.Z, 없으면 hotfix PATCH+1
    - python3 scripts/ci/publish_release.py version
    # 1-b) **EditMode 테스트를 빌드 전에 돌린다** (S15P21B202-407 ③).
    #
    # 릴리스 파이프라인에는 검사가 0건이었다 — master push 에서 생기는 잡이 이것 하나다.
    # unity-compile 의 rules 는 merge_request_event·develop 이라 여기 없고, MR 파이프라인은
    # **소스 브랜치**를 검사하므로 머지 결과 트리(충돌 해소 포함)는 어디서도 검사되지 않은
    # 상태로 릴리스됐다.
    #
    # master 에 unity-compile 을 따로 붙이지 않는 이유: resource_group: unity 로 릴리스와
    # 직렬화되어 총 시간이 두 배가 된다. 여기서 돌리면 **같은 Unity 임포트를 재사용**한다 —
    # 콜드 임포트가 이미 이 잡에서 한 번 일어나므로 추가 비용은 테스트 실행분뿐이다.
    #
    # 실패하면 빌드하지 않는다. ❌ 줄을 남기므로 mm-ci-failed 가 그것을 카드의 이유로 싣는다.
    # **같은 트리를 이미 전체로 검사했으면 빌려 온다** (S15P21B202-642).
    #
    # 릴리스 시점의 master 트리는 develop 과 같은 것이 보통이고(릴리스 머지가 파일을
    # 바꾸지 않는다), 그 트리는 develop 의 `unity-compile` 이 **Heavy 까지 포함해**
    # 이미 검사했다. 2026-09-18 실측: 여기서 20분 20초가 들었고 결과는 develop 이 낸
    # 것과 실패 수까지 같았다(26 = 26). 릴리스 24.8분의 82% 였다.
    #
    # 지문이 다르면(핫픽스로 갈라졌다면) 그냥 돈다 — 그때가 이 검사가 필요한 때다.
    - python3 scripts/ci/unity_reuse.py borrow || true
    - echo "=== EditMode 테스트 (빌드 전) ==="
    - |
      set +e
      if [ -s "$CI_PROJECT_DIR/unity-reused.txt" ]; then
        TRC=$(cat "$CI_PROJECT_DIR/unity-rc.txt")
        echo "↻ 잡 $(cat "$CI_PROJECT_DIR/unity-reused.txt") 의 결과를 쓴다 (종료 코드 $TRC)"
      else
        unity-editor \
          -projectPath METAGAME \
          -runTests -testPlatform EditMode \
          -testResults "$CI_PROJECT_DIR/unity-results.xml" \
          -logFile "$CI_PROJECT_DIR/unity-tests.log"
        TRC=$?
      fi
      set -e
      echo "테스트 종료 코드 $TRC"
    - python3 scripts/ci/publish_release.py gate "$TRC" "$CI_PROJECT_DIR/unity-results.xml" "$CI_PROJECT_DIR/unity-tests.log"
    # 2) Windows 빌드. unity-editor 래퍼가 xvfb·-batchmode 를 붙인다. 실패해도 여기서 죽지 않고 3) 이 🔴 를 보낸다
    - echo "=== Windows 빌드 시작 ($(cat release-version.txt)) ==="
    - date -u +"시작 %H:%M:%S UTC"
    # **빌드에 릴리스 버전을 넘긴다** (S15P21B202-404). `BuildStamp` 가 이 값을 `버전=` 줄로
    # 박고 서버가 그것으로 구버전을 막는다. 위 `publish_release.py version` 이 이미 정해 둔
    # 값을 그대로 쓴다 — 빌드 쪽에서 태그를 다시 읽으면 두 곳이 어긋나고, 어긋난 버전은
    # **게이트를 조용히 무력화**한다.
    - export SPACE_RELEASE_VERSION="$(cat release-version.txt)"
    - |
      set +e
      unity-editor \
        -projectPath METAGAME \
        -quit \
        -buildTarget StandaloneWindows64 \
        -executeMethod Metagame.EditorTools.SpaceBuild.BuildWindows \
        -logFile "$CI_PROJECT_DIR/unity-build.log"
      RC=$?
      set -e
      date -u +"종료 %H:%M:%S UTC (exit $RC)"
      grep -n "error CS\|\[NotThisPlanet\] 빌드" "$CI_PROJECT_DIR/unity-build.log" | tail -5 || true
      python3 scripts/ci/build_timing.py "$CI_PROJECT_DIR/unity-build.log" || true
    # 2-b) **빌드가 추적되는 에셋을 지웠는지 본다** (S15P21B202-351).
    #
    # 배치모드 빌드는 임포트 과정에서 에셋을 재직렬화하고, 에디터 스크립트가 에셋을
    # 지우기도 한다 — `ArtLink.CleanStale` 이 실제로 `PF_Stage1_Tablet.prefab` 을 매
    # 빌드 지웠다. 그러면 **그 에셋이 빠진 플레이어가 빌드되고**, `Resources` 아래는
    # `Resources.Load` 로만 쓰여 컴파일 검사에 안 걸리고, CI 워크스페이스는 매번
    # `git clean` 되므로 **삭제가 커밋되지 않아 흔적도 안 남는다.** 종료 코드는 0이다.
    #
    # 삭제(D)만 막는다. 재직렬화(M)는 배치모드에서 정상적으로 자주 생기므로 세기만 한다.
    # **여기서 exit 하지 않는다** — 아래 3) 이 🔴 카드를 보내고 실패시키는 구조이므로
    # RC 만 올려 그쪽에 맡긴다. 앞에서 죽으면 릴리스 실패가 MM 에 안 알려진다.
    #
    # 판정은 개발 빌드와 **같은 파일**에 있다(S15P21B202-532) — 여기에 복사해 두었더니
    # 개발 빌드 쪽이 더 무딘 검사를 쓰게 되어 그 잡이 매번 죽었다.
    - sh scripts/ci/unity_dirty_guard.sh || RC=1
    # 3) zip → 패키지 레지스트리(잡 토큰) → Release(태그는 ref 로 생성) → MM 🟢. RC≠0 이면 🔴 만 보내고 실패
    - python3 scripts/ci/publish_release.py publish "$RC"
    # 요약 **초안**은 여기 있지 않다 — 아래 `release-summary` 잡이다 (S15P21B202-579).
  artifacts:
    when: always
    expire_in: 14 days
    paths: [unity-build.log, unity-tests.log, unity-results.xml, release-version.txt, release-notes.md, release-package.txt]   # zip 은 아티팩트에 싣지 않는다 — 상한(100MB)에 걸린다. 패키지 레지스트리에 있다
    reports:
      junit: unity-junit.xml    # 실패한 테스트를 파이프라인 화면에서 바로 본다(unity-compile 과 같은 결)

release-summary:          # 사용자용 요약 **초안** (S15P21B202-462 · 잡 분리는 -579)
  stage: notify           # 릴리스가 끝난 뒤다. 초안은 릴리스의 산출물이 아니라 그 다음 일이다.
  # **이미지를 덮어쓰지 않는다.** 기본 이미지(python:3.12)에만 `claude` CLI 가 있다 —
  # `ai-review` 가 그 위에서 돈다(`백엔드=cli claude=/usr/local/bin/claude`).
  # 처음에는 이 단계가 `release-windows` 안에 있었는데 그 잡은 Unity 이미지라
  # `find_claude()` 가 None 이었고, `|| true` 에 묻혀 **초안이 한 번도 안 나왔다.**
  # `test_release_summary.py` 가 이 잡에 `image:` 가 없는지 검사한다.
  needs:
    - job: release-windows
      artifacts: true     # `release-version.txt` 를 받는다. 버전을 여기서 다시 정하면
                          # 두 곳이 어긋나고, 어긋난 버전으로 쓴 요약은 아무도 못 알아본다
  interruptible: false
  # **릴리스를 막지 않는다.** 사람이 고쳐서 쓰는 초안이고, Jira 나 Claude 가 잠깐 안 되는
  # 것으로 배포를 세우면 그다음부터 사람이 이 잡을 지우고 싶어진다. 다만 `|| true` 로
  # 성공인 척하지는 않는다 — 실패는 파이프라인에 ⚠ 로 남아야 다음에 누가 본다.
  allow_failure: true
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"
  script:
    # **공개하지 않는다.** 아티팩트로만 남고, 사이트·Release·Jira 에 싣는 것은 사람이
    # 보고 고친 뒤다 — `release-prod`(공개 버튼)와 같은 결이다.
    - python scripts/ci/release_summary.py "$(cat release-version.txt)"
  artifacts:
    when: always
    expire_in: 30 days    # 릴리스 로그(14일)보다 길게 — 사람이 고쳐 올리는 데 그만큼 걸린다
    paths: [release-summary.md]

build-devbuild:           # QA 가 쓸 개발·QA 빌드 (S15P21B202-460)
  stage: deploy           # **손으로 빌드해 나눠 주는 일을 없앤다.** QA 는 두 번 일어나는데
  image: unityci/editor:ubuntu-6000.5.4f1-windows-mono-3.2.2   # (머지 뒤 develop · 머지 전 그 MR)
  tags: [linux]           # 런처는 릴리스된 버전만 볼 수 있어서 정작 그때 쓸모가 없었다.
  needs: []
  resource_group: unity   # unity-compile·release-windows 와 같은 그룹 — Unity 가 겹치면 서로 굶는다
  timeout: 90m
  interruptible: false
  # **이 rules 를 고치면 `publish_devbuild.trigger_allowed()` 도 같이 고쳐야 한다**
  # (S15P21B202-537). 그쪽은 "잡이 돌았다면 나도 통과한다" 를 전제로 어긋남을
  # **실패**로 내므로, 여기만 고치면 그 트리거로 돈 빌드가 마지막 줄에서 죽는다.
  # `test_devbuild_dry_run.py` 가 이 줄들을 읽어 대조하므로 잊으면 그 검사가 깨진다.
  rules:
    # **develop 은 새벽에만.** 머지마다 돌리면 웜이어도 10분대인 데다 `resource_group`
    # 때문에 `unity-compile` 과 직렬이라 **아침에 MR 검사가 줄을 선다**(-460 의 비용 표).
    - if: $CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_DEPLOY_DEV == "true"
    # **master 로 가는 MR 에는 만들지 않는다** (S15P21B202-644).
    #
    # 릴리스 MR(`!535`)에 이 버튼이 떠서 헷갈렸고 **실제로 눌렸다.** 이 버튼은
    # develop 으로 가는 MR 의 QA 용이고, 릴리스 빌드는 `release-windows` 가 만든다.
    # 누르면 `qa-<MR>-<sha>` 라는 **다른 빌드**가 하나 더 나오는데, `resource_group:
    # unity` 라 **릴리스의 `unity-compile` 앞에 줄을 선다** — 2026-09-18 에 릴리스가
    # 한 칸 밀렸다(취소했다).
    #
    # **`target == master` 로 가른다.** 릴리스(`release/…`)와 핫픽스(`hotfix/…`)가
    # 둘 다 master 로 가고 **둘 다 `release-windows` 가 빌드를 만든다** — 브랜치 이름
    # 패턴보다 이쪽이 이유를 그대로 말한다.
    #
    # 파이프라인 생성은 거절되지 않는다. `publish-devbuild` 의 needs 가
    # `optional: true` 라 이 잡이 없어도 된다 — `-467` 에서 `release-prod` 가 그것에
    # 당했고 그 뒤로 붙었다.
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "master"
      when: never
    # **MR 은 버튼.** 리뷰를 기다리는 동안 그 브랜치 빌드로 QA 를 돌릴 수 있어야 한다.
    # `allow_failure` 로 둬서 **누르지 않은 버튼이 파이프라인을 붙잡지 않는다.**
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: manual
      allow_failure: true
  variables:
    SPACE_BUILD_DIR: "$CI_PROJECT_DIR/devbuild/NotThisPlanet"
    SPACE_DEV: "1"        # 개발 백엔드(`/dev`)를 가리키는 빌드다 — 실유저 서버가 아니다
  script:
    - LIC=/root/.local/share/unity3d/Unity/Unity_lic.ulf
    - |
      if [ ! -s "$LIC" ]; then
        echo "❌ Unity 라이선스가 마운트되지 않았다: $LIC (S15P21B202-271)"; exit 1
      fi
    - python3 scripts/ci/publish_devbuild.py version
    - echo "=== 빌드 시작 ($(cat release-version.txt)) ==="
    # **릴리스 버전을 박지 않는다.** dev·qa 빌드는 `vX.Y.Z` 가 아니므로 `-404` 의
    # 게이트에서 "버전을 못 읽음" 이 된다 — 그래서 개발 서버는 게이트를 꺼 둔다.
    #
    # **대신 신원은 박는다** (S15P21B202-597). `BuildStamp` 가 이 값을 `빌드=` 줄로
    # 넣고, 이벤트와 런로그 헤더가 그것을 읽는다. 위 `publish_devbuild.py version` 이
    # 이미 정해 둔 이름(`qa-498-5275441c` · `dev-20260917-9ae7220d`)을 그대로 쓴다 —
    # 여기서 다시 만들면 배치된 파일 이름과 이벤트의 이름이 어긋난다.
    #
    # 이 줄이 없던 동안 개발 빌드로 모은 이벤트는 전부 `build: ""` 였다. QA 는 개발
    # 빌드로 하므로, 쌓아 둔 것 대부분이 어느 빌드의 판인지 말하지 못한다.
    - export SPACE_BUILD_ID="$(cat release-version.txt)"
    - |
      set +e
      unity-editor \
        -projectPath METAGAME \
        -quit \
        -buildTarget StandaloneWindows64 \
        -executeMethod Metagame.EditorTools.SpaceBuild.BuildWindows \
        -logFile "$CI_PROJECT_DIR/devbuild.log"
      RC=$?
      set -e
      grep -n "error CS\|\[NotThisPlanet\] 빌드" "$CI_PROJECT_DIR/devbuild.log" | tail -5 || true
    # **빌드가 추적되는 에셋을 지웠는지 본다** (S15P21B202-351) — 릴리스와 **같은 조각**을 쓴다.
    #
    # 전에는 여기서 `git diff --quiet` 로 **바뀌기만 하면** 실패했다. 배치모드는 차가운
    # Library 에서 늘 재직렬화하므로 이 잡은 성공할 수가 없었고, 2026-09-15 첫 새벽
    # 실행부터 죽었다(재직렬화 20건 · 삭제 0건 · 빌드는 444.5MB 로 성공). S15P21B202-532.
    #
    # **여기서 exit 하지 않는다.** 릴리스 쪽이 같은 이유로 그렇게 해 뒀다 — 앞에서 죽으면
    # 아래 `publish_devbuild.py` 가 못 돌아 **실패가 아무에게도 안 알려진다.** 새벽 실패가
    # 조용했던 이유의 절반이 이것이다(나머지 절반은 `mm-ci-failed` 가 schedule 에 없는 것).
    - sh scripts/ci/unity_dirty_guard.sh || RC=1
    - python3 scripts/ci/publish_devbuild.py publish "$RC"
    # **배치까지 잇는다** (S15P21B202-582). MR 것만 넘긴다 — 새벽 빌드는 같은
    # 파이프라인에 `publish-devbuild` 가 이미 있어서, 여기서 또 부르면 두 번 배치된다.
    # 그 판정은 `trigger_stage.needs_stage()` 안에 있다(여기서 `if` 로 가르면 두 곳이
    # 어긋난다). 넘길 것이 없으면 그렇다고 찍고 0 으로 끝낸다.
    - python3 scripts/ci/trigger_stage.py
  artifacts:
    when: always
    expire_in: 3 days     # 로그만 남긴다. zip 은 레지스트리를 거쳐 바로 배치되고 지워진다
    paths: [devbuild.log, release-version.txt, release-package.txt]

publish-devbuild:         # 개발·QA 빌드를 배포 폴더로 (S15P21B202-460)
  stage: deploy           # `publish-builds` 와 같은 이유로 배포 러너에서 돈다 —
  image: python:3.12      # 공용 러너에 /var/www 를 rw 로 주지 않는다.
  tags: [deploy]
  needs:
    # **`optional: true` 가 없으면 qa 배치 경로가 아예 안 만들어진다.** web 파이프라인
    # (`STAGE_VERSION`)에서는 `build-devbuild` 가 rules 로 빠지는데, 없는 잡을 `needs` 로
    # 걸면 GitLab 은 **파이프라인 생성 자체를 거절한다.** `release-prod` 가 `-467` 에서
    # 똑같이 당했다. `glab ci lint` 는 rules 를 평가하지 않아 통과한다 — 여기서만 걸린다.
    - job: build-devbuild
      artifacts: true
      optional: true
  interruptible: false
  rules:
    # 새벽 빌드는 바로 배치한다 — 스케줄의 ref 는 `develop`(보호 브랜치)이라 배포 러너가 집는다.
    - if: $CI_PIPELINE_SOURCE == "schedule" && $NIGHTLY_DEPLOY_DEV == "true"
    # **MR 파이프라인에서는 이 잡을 만들지 않는다.** 배포 러너는 `ref_protected` 라
    # MR ref 의 잡을 **아예 집지 않는다**(`-405` 실측). 만들어 두면 눌렀을 때 러너를
    # 찾지 못해 **영원히 pending 으로 파이프라인을 붙잡는다.**
    #
    # **qa 빌드는 트리거로 온다** (S15P21B202-582). MR 의 `build-devbuild` 가 끝나면서
    # `trigger_stage.py` 로 `develop` 대상 파이프라인을 만들고 `STAGE_VERSION` 을 넘긴다.
    # 그쪽 ref 는 보호 브랜치라 배포 러너가 집는다.
    #
    # **자동이다.** 여기서 또 누르게 하면 그 버튼도 Maintainer 만 누를 수 있어 —
    # develop 은 보호 브랜치다 — 고치려던 것이 그대로 남는다.
    - if: $CI_PIPELINE_SOURCE == "trigger" && $STAGE_VERSION
    # 손으로 배치하는 길은 **남겨 둔다.** 트리거가 안 될 때(토큰 만료·API 장애)
    # 되돌아갈 자리가 있어야 한다 — `release-prod` 의 되돌리기와 같은 결이다.
    # 다만 이 길은 web 파이프라인이라 `release-windows` 리허설(90분)이 딸려 온다.
    - if: $CI_PIPELINE_SOURCE == "web" && $STAGE_VERSION
      when: manual
  script:
    - python scripts/ci/publish_builds.py stage

# ── 알림 ─────────────────────────────────────────────────────────────────
publish-builds:           # 릴리스 산출물을 사용자가 받는 자리로 (S15P21B202-405)
  stage: deploy           # zip 은 아티팩트로 못 넘긴다(156 MB · 상한 100 MB) —
  image: python:3.12      # 패키지 레지스트리를 운반 수단으로 쓰고 여기서 받는다.
  tags: [deploy]          # **공용 러너에 /var/www 를 rw 로 주지 않는다** — 그러면 아무 MR
                          # 잡이나 배포 폴더에 쓸 수 있다(-252 가 스풀을 뺀 이유와 같다).
  needs:
    - job: release-windows
      artifacts: true     # release-version.txt · release-package.txt 만 넘어온다
  interruptible: false    # 반쯤 올라간 저장소가 남으면 다음 사람이 원인을 못 찾는다
  rules:
    # 릴리스가 성공했을 때만. 리허설(web)은 zip 을 레지스트리에 올리지 않으므로 제외한다.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"
  script:
    - python scripts/ci/publish_builds.py stage

release-prod:             # 릴리스를 사용자에게 내보낸다 — **누르는 버튼은 이것 하나** (S15P21B202-592)
  stage: deploy           # ① 배포 백엔드에 jar 적용 → ② latest.json 이동.
  image: python:3.12      # 이 버튼을 누르는 순간 **게임 중인 사람이 튕기고**(백엔드 재시작 약 7초)
  tags: [deploy]          # **모든 사용자의 런처가 새 버전으로 간다.** 그래서 시점은 사람이 고른다.
  #
  # **전에는 버튼이 둘이었다** — `deploy-prod` 와 `promote-builds`. 둘이 서로를 몰라서
  # 순서도 눌렀는지도 알 수 없었고, 실제로 어긋났다: v1.1.0 에서 promote 만 눌려
  # 배포 백엔드가 **나흘째 옛 jar** 이었다(`-570` 이 prod 에 없었다). 한쪽만 눌러도
  # 파이프라인이 초록이라 아무도 몰랐다. 순서와 누락을 **스크립트가** 맡는다.
  #
  # **`optional: true` 가 없으면 되돌리기 경로가 아예 안 만들어진다** (S15P21B202-467,
  # `!368` 리뷰). 되돌리기는 web 파이프라인인데 `publish-builds` 는 master push 에서만
  # 생긴다 — 없는 잡을 `needs` 로 걸면 GitLab 은 **파이프라인 생성 자체를 거절한다.**
  needs:
    - job: publish-builds
      optional: true
    - job: release-windows
      artifacts: true
      optional: true
    # jar 을 받는다. **백엔드가 안 바뀐 릴리스에는 이 잡이 없다** — 그때는 배포를
    # 건너뛴다(`release_prod.py` 가 jar 이 없는 것으로 판단한다).
    - job: build-backend
      artifacts: true
      optional: true
  interruptible: false
  environment:
    name: production
    url: https://j15b202.p.ssafy.io/play/
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master"
      when: manual
    # 되돌리기: Run pipeline 에서 PROMOTE_VERSION 을 주고 이 잡만 돌린다.
    # **되돌리기는 백엔드를 건드리지 않는다** — 급할 때 쓰는 길이라 서버까지 되돌리면
    # 그 시간이 곧 장애 시간이다. 그 판단도 스크립트 안에 있다.
    - if: $CI_PIPELINE_SOURCE == "web" && $PROMOTE_VERSION
      when: manual
  script:
    - python scripts/ci/release_prod.py

# ── 런처 ─────────────────────────────────────────────────────────────────────
#
# **게임과 배포 경로가 다르다** (S15P21B202-508). 게임은 릴리스 때 CI 가 찍지만
# 런처는 `publish_launcher.py` 를 손으로 돌려야 했고, 언제 돌리는지가 어디에도
# 없었다. 그래서 저장소본이 **세 번** 앞서 있었다 — `-406`(개발 모드) · `-460`(채널) ·
# `-507`(로그 보존). 2026-09-14 에 `--dev` 가 안 먹어서 드러났다.
#
# **빌드는 자동, 내보내기는 버튼**으로 나눈다(`release-prod` 와 같은 결):
#   · 빌드가 자동이어야 **손으로 돌리는 것을 잊지 않는다**
#   · 내보내기가 버튼이어야 **언제 새 exe 가 나가는지 사람이 정한다** — 백신 평판
#     (`-456`)이 리셋될 수 있어 아무 때나 바꾸면 안 된다

build-launcher:           # 런처 exe 를 만든다 — **자동** (S15P21B202-508)
  stage: test
  image: mcr.microsoft.com/dotnet/sdk:10.0
  tags: [linux]
  needs: []
  rules:
    # 런처를 건드린 머지에서만 돈다. 게임 릴리스와 무관하게 움직인다 —
    # 런처 버전은 게임 버전과 별개다(`publish_launcher.py` 주석).
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
      changes: ["launcher/**/*", "scripts/launcher/**/*"]
  script:
    # **버전은 저장소에서 읽는다.** 명령줄로만 주면 CI 도 아침 점검도 무엇과
    # 견줄지 모른다 — 그래서 `launcher/VERSION` 한 줄을 둔다.
    - VER=$(tr -d ' \r\n' < launcher/VERSION)
    - echo "런처 버전 $VER"
    - |
      if [ -z "$VER" ]; then echo "❌ launcher/VERSION 이 비었다"; exit 1; fi
    # `-p:Version=` 을 빠뜨리면 `0.0.0-dev` 가 조용히 나간다 — csproj 의 가드가
    # 릴리스 publish 를 막지만(`-475`), 여기서도 값을 확인하고 넘긴다.
    - dotnet publish launcher/NotThisPlanetLauncher.csproj -c Release -p:Version=$VER -o out/launcher
    - ls -la out/launcher
  artifacts:
    name: launcher-$CI_COMMIT_SHORT_SHA
    paths: ["out/launcher/NotThisPlanetLauncher.exe"]
    # **1주로는 모자란다** (`!423` 리뷰). 이 설계는 `promote-launcher` 를
    # **의도적으로 미루는 것**을 전제한다 — 백신 평판(`-456`)이 리셋될 수 있어
    # 언제 새 exe 를 내보낼지 사람이 정한다. 1주 넘게 미루면 아티팩트가 만료돼
    # **버튼을 눌러도 exe 가 없고**, 그동안 아침 점검은 계속 "버튼을 누르면
    # 사용자에게 갑니다" 라고 안내한다. 15MB 한 벌이라 한 달은 부담이 아니다.
    expire_in: 1 month

promote-launcher:         # 런처를 사용자에게 — **사람이 누른다** (S15P21B202-508)
  stage: deploy           # 누르는 순간 새 exe 가 사이트의 내려받기 자리에 놓인다.
  image: python:3.12      # 백신이 서명 없는 exe 를 평판으로 판정하므로(`-456`),
  tags: [deploy]          # 언제 바꿀지는 사람이 정한다.
  # **`optional: true` 가 없으면 파이프라인 생성 자체가 거절된다** (`-467` 에서 겪은 것).
  # `build-launcher` 는 launcher/ 가 바뀐 머지에서만 생기는데, 이 잡은 그때만 쓰이므로
  # 같은 조건이지만 — rules 가 어긋나는 순간을 대비해 optional 로 둔다.
  needs:
    - job: build-launcher
      artifacts: true
      optional: true
  interruptible: false
  environment:
    name: production
    url: https://j15b202.p.ssafy.io/play/
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
      changes: ["launcher/**/*", "scripts/launcher/**/*"]
      when: manual
  script:
    # **아티팩트가 없으면 여기서 멈춘다** (`!423` 리뷰). `needs` 가 `optional: true`
    # 라 `build-launcher` 가 없거나 아티팩트가 만료돼도 이 잡은 돈다 — 그러면
    # `publish_launcher.py` 가 없는 파일을 받아 알아보기 어려운 오류로 죽는다.
    - |
      EXE=out/launcher/NotThisPlanetLauncher.exe
      if [ ! -f "$EXE" ]; then
        echo "❌ 런처 exe 가 없다: $EXE"
        echo "   build-launcher 의 아티팩트가 만료됐거나 그 잡이 안 돌았습니다."
        echo "   같은 파이프라인의 build-launcher 를 다시 실행한 뒤 이 버튼을 누르세요."
        exit 1
      fi
    - VER=$(tr -d ' \r\n' < launcher/VERSION)
    - python scripts/launcher/publish_launcher.py "$EXE" "v$VER" --out /publish/builds

publish-site:             # 배포 사이트를 nginx 자리로 (S15P21B202-405 · -452)
  stage: deploy           # 사이트는 릴리스와 다른 박자로 바뀐다(website/ 가 develop 에
  image: python:3.12      # 머지될 때). 그래서 릴리스 잡에 묶지 않는다.
  tags: [deploy]
  needs: []
  interruptible: false
  rules:
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop"
      changes: ["website/**/*"]
  variables:
    # LFS 실파일이 있어야 한다 — 포인터를 올리면 영상·이미지가 전부 깨진다.
    GIT_LFS_SKIP_SMUDGE: "0"
  script:
    - python scripts/ci/publish_site.py

mm-ci-failed:             # 🔴 CI 실패 알림 — 실패한 잡 이름·링크·이유 + 담당 @멘션
  stage: notify
  # **전부 optional 이어야 한다**(S15P21B202-344). develop push 파이프라인에는 mr-lint·
  # repo-hygiene·mr-overlap 이 아예 없고(그 잡들의 rules 가 merge_request_event 다),
  # optional 이 아닌 needs 는 그 자리에서 파이프라인 생성을 실패시킨다.
  # MR 파이프라인에서는 그 셋이 항상 만들어지므로 뜻이 달라지지 않는다.
  needs:
    - job: mr-lint
      optional: true
    - job: repo-hygiene
      optional: true
    - job: ci-tests
      optional: true      # MR 에서는 항상 돈다(-632). optional 은 다른 소스를 위해 남긴다
    - job: mr-overlap
      optional: true
    - job: unity-compile  # 이것이 빠져 있어 unity-compile 만 실패하면 카드가 안 나갔다(-344)
      optional: true      # changes: 게이트라 없는 파이프라인이 있다
    - job: ai-review-gate # ⛔ 로 막힌 것도 카드로 알린다. 이유(❌ 줄)는 잡 로그에서 뽑힌다(-341)
      optional: true
    # **여기에 수동 잡을 넣으면 안 된다** (S15P21B202-533, `!448` AI 리뷰).
    # `needs` 에 든 잡이 버튼인 채로 남아 있으면 GitLab 이 이 잡을 **skipped** 로 만든다 —
    # 카드가 통째로 사라진다. 실제로 그렇게 됐다: `build-devbuild`(MR 에서는 버튼)를
    # 넣자 `!448` 의 파이프라인 `194534`·`195115` 에서 `ci-tests`·`ai-review-gate` 가
    # 실패했는데도 이 잡이 `skipped` 였다. 같은 시각 `!443`(옛 목록)은 `success` 였다.
    #
    # 그래서 **버튼이 될 수 있는 잡은 전부 뺀다**: `deploy-dev`(develop push) ·
    # `build-devbuild`(MR) · `publish-devbuild`(web) · `deploy-prod` · `promote-*`.
    # 예약 실행은 그 잡들이 전부 **자동**이므로 아래 `mm-nightly-*` 가 따로 맡는다.
    - job: build-backend
      optional: true      # 버튼인 적이 없다 — MR · develop push · 예약 모두 자동이다
    - job: release-windows
      optional: true      # master push 파이프라인에만 있다. **잡이 아예 못 뜬 경우**(이미지
                          # pull 실패·러너 정지·90분 타임아웃·취소)까지 이 needs 가 덮는다 —
                          # 스크립트 안에 notify 를 흩뿌려서는 그 경우를 알릴 수 없다(-407 ①)
  when: on_failure
  rules:
    # 예약 실행은 `mm-nightly-*` 가 맡는다 — needs 를 둘 수 없기 때문이다(위 주석).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $MM_WEBHOOK_URL
    # develop 이 빨간 것은 MR 실패와 성격이 다르다 — 그 순간 모든 사람의 다음 브랜치가
    # 빨간 기준선 위에서 시작한다. 2026-09-08 에 두 커밋 연속 실패하고 카드가 0건이었다.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop" && $MM_WEBHOOK_URL
    # **master 가 빠져 있었다** (S15P21B202-407 ①). master 머지 = 릴리스인데, 90분짜리
    # release-windows 가 실패해도 카드가 나가지 않았다. 릴리스 브랜치를 머지하고 기다리다
    # 잊게 된다 — 실측 2026-09-10: master 파이프라인 이력 0건, 즉 한 번도 안 돈 경로다.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $MM_WEBHOOK_URL
    # 리허설(Run pipeline)도 알린다 (`!336` AI 리뷰). 리허설은 90분짜리 릴리스 경로를
    # 실제 릴리스 없이 지나가 보는 것인데, 그 실패가 조용하면 **이 이슈가 고치려던
    # 그 문제**가 새 경로에 그대로 생긴다 — "알림 목록에서 빠진 잡은 조용히 실패한다".
    - if: $CI_PIPELINE_SOURCE == "web" && $MM_WEBHOOK_URL
  script:
    - python scripts/ci/mm_notify.py ci-failed
  allow_failure: true

mm-ci-resolved:           # 검사 통과 시, 남아 있는 CI 실패 코멘트를 '해소됨' 으로 갱신 (S15P21B202-102)
  stage: notify
  needs:                  # mm-ci-failed 와 **같은 목록**이어야 한다. 달랐을 때는 ci-tests·mr-overlap 이
    - job: mr-lint        # 실패해도 '해소됨' 이 찍혔고, 같은 파이프라인에서 🔴 와 ✅ 가 같은 마커에
      optional: true      # 동시에 써서 결과가 비결정적이었다(-289). 실패한 잡이 needs 에 있으면
    - job: repo-hygiene   # when: on_success 가 알아서 이 잡을 건너뛴다.
      optional: true      # optional 인 이유는 mm-ci-failed 쪽 주석 참고(-344).
    - job: ci-tests
      optional: true      # MR 에서는 항상 돈다(-632). optional 은 다른 소스를 위해 남긴다
    - job: mr-overlap
      optional: true
    - job: unity-compile
      optional: true
    - job: ai-review-gate # mm-ci-failed 와 같은 목록이어야 한다 — 다르면 ⛔ 로 막힌 MR 에
      optional: true      # '해소됨' 이 찍힌다(-289 와 같은 사고)
    # **여기에 수동 잡을 넣으면 안 된다** (S15P21B202-533, `!448` AI 리뷰).
    # `needs` 에 든 잡이 버튼인 채로 남아 있으면 GitLab 이 이 잡을 **skipped** 로 만든다 —
    # 카드가 통째로 사라진다. 실제로 그렇게 됐다: `build-devbuild`(MR 에서는 버튼)를
    # 넣자 `!448` 의 파이프라인 `194534`·`195115` 에서 `ci-tests`·`ai-review-gate` 가
    # 실패했는데도 이 잡이 `skipped` 였다. 같은 시각 `!443`(옛 목록)은 `success` 였다.
    #
    # 그래서 **버튼이 될 수 있는 잡은 전부 뺀다**: `deploy-dev`(develop push) ·
    # `build-devbuild`(MR) · `publish-devbuild`(web) · `deploy-prod` · `promote-*`.
    # 예약 실행은 그 잡들이 전부 **자동**이므로 아래 `mm-nightly-*` 가 따로 맡는다.
    - job: build-backend
      optional: true      # 버튼인 적이 없다 — MR · develop push · 예약 모두 자동이다
    - job: release-windows
      optional: true      # master push 파이프라인에만 있다. **잡이 아예 못 뜬 경우**(이미지
                          # pull 실패·러너 정지·90분 타임아웃·취소)까지 이 needs 가 덮는다 —
                          # 스크립트 안에 notify 를 흩뿌려서는 그 경우를 알릴 수 없다(-407 ①)
  when: on_success
  rules:
    # 예약 실행은 `mm-nightly-*` 가 맡는다 — needs 를 둘 수 없기 때문이다(위 주석).
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # develop 이 초록으로 돌아온 것도 알린다 — 🔴 카드가 "빨간 기준선 위에서 시작한다" 고
    # 경고했으니 풀렸다는 말도 같은 채널에 있어야 한다. 직전 파이프라인이 실패였을 때만 보낸다.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "develop" && $MM_WEBHOOK_URL
    # mm-ci-failed 와 **같은 목록·같은 조건**이어야 한다(-289). 다르면 실패한 릴리스에
    # '해소됨' 이 찍힌다.
    - if: $CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH == "master" && $MM_WEBHOOK_URL
    # 리허설(Run pipeline)도 알린다 (`!336` AI 리뷰). 리허설은 90분짜리 릴리스 경로를
    # 실제 릴리스 없이 지나가 보는 것인데, 그 실패가 조용하면 **이 이슈가 고치려던
    # 그 문제**가 새 경로에 그대로 생긴다 — "알림 목록에서 빠진 잡은 조용히 실패한다".
    - if: $CI_PIPELINE_SOURCE == "web" && $MM_WEBHOOK_URL
  script:
    - python scripts/ci/mm_notify.py ci-resolved
  allow_failure: true

# ── 예약 실행 전용 알림 (S15P21B202-533) ────────────────────────────────────
#
# **`needs` 가 없다.** 이것이 이 잡들이 따로 있는 이유다.
#
# 예약 실행에서 실패하는 것은 `deploy-dev`·`build-devbuild`·`publish-devbuild` 인데,
# 그 셋은 **다른 파이프라인에서는 버튼**이라 `mm-ci-*` 의 `needs` 에 넣을 수 없다 —
# 넣으면 버튼을 안 누른 MR·develop push 에서 알림 잡이 통째로 `skipped` 된다.
#
# `needs` 를 아예 두지 않으면 GitLab 이 **스테이지 순서**로 미룬다: `notify` 는
# `deploy` 다음이므로 그 셋이 끝난 뒤에 돈다. 예약 실행에는 버튼이 하나도 없어
# 붙잡힐 일도 없다. `mm-ci-*` 가 `needs` 를 쓰는 까닭(빨리 알리기)은 하루 한 번
# 도는 이 경로에서는 값이 없다.
#
# **회복 카드(`ci-resolved`)는 없다.** 보낼 수가 없다 — 04:00 새벽 배포와 09:30 아침
# 점검이 **둘 다 `source=schedule`** 이라, 09:33 점검이 성공하면 04:03 새벽 실패를
# "해소" 로 보고 ✅ 를 보내게 된다. 이 이슈가 없애려던 거짓 회복과 같은 모양이다
# (`!448` AI 리뷰).
#
# 둘을 가를 신호가 없다: 파이프라인 변수는 Developer 에게 **403** 이고(실측),
# 생성 시각도 못 쓴다 — 예약은 손으로도 돌릴 수 있어 시각이 제각각이다
# (실측 `191907` 23:32 · `184417` 10:18). 그래서 **거짓말하느니 말하지 않는다.**
# 🔴 카드가 이미 "고칠 때까지 매일 같은 시각에 다시 실패한다" 고 적는다.

mm-nightly-failed:        # 🔴 예약 실행 실패 — 새벽 배포·아침 점검
  stage: notify
  when: on_failure
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $MM_WEBHOOK_URL
  script:
    - python scripts/ci/mm_notify.py ci-failed
  allow_failure: true


mm-digest:                # 스케줄 파이프라인(매일 09:30 · 실제 발송 09:33) — needs-fix·오래 열린 MR·정체 이슈 요약을 MM 채널로
  stage: notify
  needs:                  # ci-tests 를 **기다리되 결과에 매이지 않는다**. needs 가 없으면 lint 가
    - job: ci-tests       # 빨간 순간 이 잡이 건너뛰어져 아침 카드가 아예 안 나간다(-289).
      optional: true      # when: always 라 ci-tests 가 실패해도 카드는 나가고, 실패 사실을 카드가 싣는다.
  rules:
    # **새벽 배포 스케줄에는 끼지 않는다** (S15P21B202-455). 스케줄 파이프라인은
    # 소스가 다 `schedule` 이라, 변수로 가르지 않으면 아침 카드가 하루 두 번 나간다.
    - if: $CI_PIPELINE_SOURCE == "schedule" && $MM_WEBHOOK_URL && $NIGHTLY_DEPLOY_DEV != "true"
      when: always
  script:
    - python scripts/ci/mm_digest.py
