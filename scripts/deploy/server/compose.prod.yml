services:
  mysql:
    image: mysql:8.0
    container_name: metagame-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: metagame
      MYSQL_USER: metagame
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    container_name: metagame-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/metagame?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: metagame
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 플레이 로그를 **컨테이너 밖**에 둔다 (S15P21B202-443). 안에 두면 배포할 때마다 사라진다.
      RUNLOG_DIR: /var/log/metagame-runlogs
      # 예전 릴레이. relay.provider=edgegap 으로 되돌릴 때만 쓴다 (S15P21B202-299 에서 폐기)
      EDGEGAP_RELAY_TOKEN: ${EDGEGAP_RELAY_TOKEN:-}
      # 우리 릴레이 (S15P21B202-299 · -303)
      #   .env 에 있어도 여기 적지 않으면 컨테이너에 들어가지 않는다 — .env 는 이 파일 안
      #   ${} 치환에만 쓰인다. -303 에서 그것 때문에 릴레이가 한 번도 안 붙었다.
      RELAY_PROVIDER: ${RELAY_PROVIDER:-local}
      #   컨테이너의 127.0.0.1 은 컨테이너 자신이다. host.docker.internal 로 호스트를 가리킨다.
      RELAY_CONTROL_URL: ${RELAY_CONTROL_URL:-http://host.docker.internal:17779}
      #   클라이언트가 붙을 공개 주소. 비어 있으면 릴레이를 쓰지 않고 직접 접속으로 간다.
      RELAY_PUBLIC_ADDRESS: ${RELAY_PUBLIC_ADDRESS:-}
      TZ: Asia/Seoul
    volumes:
      # **로그는 호스트에 남는다** (S15P21B202-443). 컨테이너 안에 두면 배포할 때마다
      # 사라지고, 정작 버그를 쫓을 때 없다. dev·prod 를 나눠 둔다 — 섞이면
      # 어느 서버의 로그인지 파일 안을 열어 봐야 안다.
      - /var/log/metagame-runlogs:/var/log/metagame-runlogs
    # host.docker.internal 은 리눅스 도커에서 기본 제공되지 않는다 — 이 줄이 있어야 생긴다.
    # 게이트웨이 IP(172.18.0.1 등)를 박지 않으려고 이렇게 쓴다. compose 망이 바뀌어도 따라간다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mysql-data:
