services:
  mysql:
    image: mysql:8.0
    container_name: metagame-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: metagame
      MYSQL_USER: metagame
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    container_name: metagame-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/metagame?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: metagame
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      TZ: Asia/Seoul
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  mysql-data:
