# 개발 백엔드 (S15P21B202-284).
#
# **prod 와 나란히 돈다.** 같은 호스트이지만 compose 프로젝트가 달라
# (`docker compose -p metagame-dev`) 컨테이너 이름과 볼륨이 갈린다. 그래서 이 파일을
# 올려도 prod 의 `metagame-backend`·`metagame-mysql` 은 건드려지지 않는다.
#
# 왜 나누나: `develop` 머지마다 자동 배포하면 재시작이 **접속 중인 실유저의 WebSocket
# 세션을 전부 끊는다**. 그래서 develop 은 이쪽으로만 간다.
#
# 포트: 밖에 열지 않는다. nginx 가 `/dev/` 를 8081 로 넘긴다 — 새 포트를 열려면 SSAFY
# 보안그룹이 필요하고 우리가 못 정한다(`-284` "정해야 할 것" 1번의 결론).
services:
  mysql:
    image: mysql:8.0
    container_name: metagame-dev-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: metagame
      MYSQL_USER: metagame
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Seoul
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    volumes:
      # **prod 와 다른 볼륨이다.** 같은 이름을 쓰면 두 백엔드가 한 DB 를 잡고
      # 개발 중 스키마 변경이 실유저 데이터를 건드린다.
      - mysql-dev-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: .
    container_name: metagame-dev-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/metagame?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      DB_USERNAME: metagame
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      # 릴레이는 **공유한다** — 하나뿐인 프로세스가 TCP 17779 를 잡고 있고, 두 번째를
      # 띄우려면 포트를 또 열어야 한다. dev 테스트가 릴레이 슬롯을 같이 쓰는 것은
      # 감안한다. 나누려면 별 이슈로 뺀다.
      RELAY_PROVIDER: ${RELAY_PROVIDER:-local}
      RELAY_CONTROL_URL: ${RELAY_CONTROL_URL:-http://host.docker.internal:17779}
      RELAY_PUBLIC_ADDRESS: ${RELAY_PUBLIC_ADDRESS:-}
      TZ: Asia/Seoul
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # 8081 — prod 는 8080 이다. 둘 다 루프백에만 묶는다(`-169`: 밖에 열면 UFW 와
      # 무관하게 인터넷에서 접속된다).
      - "127.0.0.1:8081:8080"

volumes:
  mysql-dev-data:
