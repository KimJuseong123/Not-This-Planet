# 로그인 속도 제한 (S15P21B202-461)
#
# `/etc/nginx/conf.d/` 에 둔다 — `limit_req_zone` 은 **http 블록**에만 놓을 수 있고
# `metagame.conf` 는 server 블록이다(`upgrade-map.conf` 와 같은 이유).
#
# **왜 필요한가.** 백엔드가 인증 없이 받는 것은 `/auth/guest` · `/auth/verify` ·
# `/ws/game` 셋뿐이고 남의 데이터를 읽는 API 는 없다. 그래도 게스트 로그인을 무한히
# 부를 수 있다 — 계정 테이블이 부풀고 CPU 를 먹는다. 지금까지 사실상의 방어는
# **"아무도 주소를 모른다"** 였는데 사이트를 공개했으므로 그 전제가 사라졌다.
#
# **왜 이 값인가.** 막아야 할 것은 스크립트이고, 막으면 안 되는 것은 우리 팀과
# 플레이어다. 실제 호출 패턴:
#
#   - `/auth/guest`  : 게임을 켤 때 **한 번**
#   - `/auth/verify` : 방장이 **참가자마다 한 번** — 6인 방이 차면 5~6번이 몇 초 안에
#
# 그리고 **SSAFY 망은 NAT 뒤에 있다.** 교실 전체가 한 IP 로 보일 수 있으므로
# IP 당 제한을 빡빡하게 잡으면 우리가 먼저 막힌다. 그래서 **burst 를 넉넉히** 준다.
#
#   rate=60r/m  → 지속 초당 1회
#   burst=30    → 순간 30회까지 (방 하나가 통째로 차도 남는다)
#   nodelay     → burst 안에서는 **지연 없이** 통과 — 줄 세우면 로그인이 느려진다
#
# 초당 수백 번 때리는 쪽은 30번 만에 429 를 받는다.
limit_req_zone $binary_remote_addr zone=auth_zone:10m rate=60r/m;

# 429 가 정직하다. 기본값 503 은 "서버가 죽었다" 로 읽혀서 사용자가 다시 눌러야 할지
# 기다려야 할지 알 수 없다.
limit_req_status 429;

# 걸린 것을 알 수 있어야 값을 고칠 수 있다. 기본 error 는 과하다.
limit_req_log_level warn;
