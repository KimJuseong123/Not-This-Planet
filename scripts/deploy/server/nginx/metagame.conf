server {
    server_name j15b202.p.ssafy.io;

    # ── 배포 산출물 (S15P21B202-405) ────────────────────────────────────
    #
    # **왜 여기서 내보내나.** 릴리스 zip 은 GitLab 패키지 레지스트리에 올라가는데 이
    # 프로젝트는 visibility: private 이라 무인증 접근이 HTTP 302(로그인)다. 즉 링크를
    # 줘도 사용자가 받을 수 없다. 클라이언트에 읽기 토큰을 박는 것은 택할 수 없다 —
    # 배포된 exe 의 문자열은 누구나 꺼내고, 그 토큰 하나로 저장소 패키지가 전부 열린다.
    #
    # 여기에는 **데이터만** 둔다(S15P21B202-324). nginx 는 정적으로 내보내고 실행하지
    # 않는다. autoindex 를 켜서 사람이 목록을 볼 수 있게 한다 — 런처(-406)가 생기기
    # 전까지는 그 목록이 곧 배달 수단이다.
    location /builds/ {
        alias /var/www/metagame-builds/;
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;

        # 캐시·이어받기는 손대지 않는다. nginx 는 정적 파일에 Accept-Ranges 를 이미
        # 주고, 중첩 location 에 alias 를 또 두면 경로가 어긋난다. 필요해지면 그때 잰다.
    }

    # ── 개발 백엔드 (S15P21B202-284) ────────────────────────────────────
    #
    # **경로로 나눈다.** 새 포트(예: 8443)는 SSAFY 보안그룹이 열어 줘야 하고 우리가
    # 못 정한다. 클라이언트가 `httpBaseUrl + "/auth/guest"` 로 조립하므로 접두가
    # 성립한다 — 개발 빌드는 base 를 `https://j15b202.p.ssafy.io/dev` 로 둔다.
    #
    # **끝의 슬래시가 접두를 떼는 것이다.** `proxy_pass http://127.0.0.1:8081/` 의
    # 마지막 `/` 가 있어야 `/dev/auth/guest` 가 백엔드에 `/auth/guest` 로 간다.
    # 빼면 `/dev/auth/guest` 를 그대로 넘겨 404 가 되고, 원인이 눈에 안 보인다.
    #
    # 이 블록이 `location /` 보다 **먼저 걸린다** — nginx 는 접두 매칭에서 더 긴 것을
    # 고르므로 순서와 무관하지만, 읽는 사람을 위해 위에 둔다.
    location /dev/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;

        # WebSocket 이 이 두 줄로 산다 — prod 와 같다. 빠뜨리면 로그인은 되는데
        # 방 입장이 안 된다(`/dev/ws/game` 이 그 경로다).
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;
    }

    # ── 배포 백엔드 (지금까지의 그것) ───────────────────────────────────
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # WebSocket 이 이 네 줄로 산다. 빠뜨리면 로그인은 되는데 방 입장이 안 된다.
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;   # 방에 가만히 있어도 끊기지 않게
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/j15b202.p.ssafy.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/j15b202.p.ssafy.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = j15b202.p.ssafy.io) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name j15b202.p.ssafy.io;
    return 404; # managed by Certbot


}