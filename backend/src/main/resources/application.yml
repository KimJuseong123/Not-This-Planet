spring:
  config:
    # 로컬 개발용 값은 backend/.env 에 둔다 (git 추적 제외). backend/.env.example 참고
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/metagame?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:metagame}
    # 기본값 없음 — 값이 없으면 부팅에 실패한다 (개발용 값으로 조용히 되돌아가지 않게)
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update   # 개발 초기 전용. 스키마 안정화 후 validate + 마이그레이션 도구로 전환
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

server:
  port: ${SERVER_PORT:8080}

jwt:
  # HS256 서명 키(base64). 기본값 없음 — 이 값이 유출되면 토큰을 위조할 수 있으므로
  # 저장소에 두지 않고 환경변수로만 주입한다. 배포 시에는 반드시 새로 생성한 값을 쓴다
  secret: ${JWT_SECRET}
  access-token-validity-ms: ${JWT_ACCESS_TOKEN_VALIDITY_MS:86400000}   # 24시간 — 게스트 로그인이라 길게 잡음

game:
  # 연결이 끊긴 플레이어의 자리를 유지하는 시간.
  # 넘기면 그 사람만 제외하고 게임은 계속되며, 이후 재입장도 가능하다 (지침 문서 5-1)
  reconnect-grace-ms: ${GAME_RECONNECT_GRACE_MS:30000}

relay:
  # **같은 망이어도 무조건 릴레이를 태운다** (S15P21B202-570).
  #
  # 같은 공유기 뒤라고 서로 닿는 것은 아니다 — 공유기가 기기끼리의 통신을 막아 두면
  # (AP isolation) 사설 주소로 못 붙는다. 교육장 WiFi 가 그럴 수 있고, 그때는 판정이
  # 아무리 맞아도 입장이 안 된다(`-145 §4-3` 이 핫스팟 우회를 적어 둔 이유).
  #
  # 그런 자리에서는 이것을 켠다. 지연이 늘고 릴레이 동시접속을 쓰지만 **되는 것이 빠른
  # 것보다 먼저다.** 기본은 꺼짐 — 배포 서버는 지금 동작 그대로다.
  always: ${RELAY_ALWAYS:false}
  # 어느 릴레이를 쓸지. local(기본) = 우리 EC2 릴레이 · edgegap = 예전 방식(되돌릴 길)
  # -298 에서 Edgegap 의 서버 검증이 우리 세션에서 동작하지 않음을 확정하고 -299 에서 바꿨다.
  provider: ${RELAY_PROVIDER:local}
  local:
    # 릴레이 제어 API. 같은 호스트의 별 프로세스이고 127.0.0.1 에만 열려 있다.
    base-url: ${RELAY_CONTROL_URL:http://127.0.0.1:17779}
    # 클라이언트가 붙을 **공개 주소**. 제어 API 는 자기 포트만 알고 밖에서 어떤 이름으로
    # 보이는지는 모른다. 비어 있으면 릴레이를 쓰지 않고 직접 접속으로 간다.
    public-address: ${RELAY_PUBLIC_ADDRESS:}
  edgegap:
    # Edgegap 릴레이 API 토큰. 비워 두면 릴레이를 쓰지 않고 같은 네트워크 직접
    # 접속으로 간다(S15P21B202-264) — 없다고 게임이 안 열리지는 않는다.
    # 저장소에 두지 않고 환경변수로만 주입한다.
    token: ${EDGEGAP_RELAY_TOKEN:}

# ── 플레이 로그 (S15P21B202-443) ───────────────────────────────────────────
# 배포판이 시작할 때 지난 실행의 로그를 보낸다. 받는 자리는 `POST /logs` 이고
# 게스트 토큰이 있어야 한다 — nginx 로 받으면 인증이 없어 누구나 파일을 부어넣는다.
metagame:
  runlog:
    # **컨테이너 밖에 남아야 한다.** 컨테이너 안에 두면 배포할 때마다 사라진다.
    # compose 가 이 경로를 호스트 볼륨으로 마운트한다.
    dir: ${RUNLOG_DIR:/var/log/metagame-runlogs}
    # 알파 기간에 그보다 오래된 로그를 다시 꺼내 본 적이 없다. 상한 없는 업로드
    # 자리는 디스크를 채우는 길이다.
    keep-days: ${RUNLOG_KEEP_DAYS:14}

  # ── 구버전 클라이언트 차단 (S15P21B202-404) ─────────────────────────────
  #
  # 런처로 막으면 우회된다 — 압축 푼 폴더의 exe 를 직접 실행하는 것이 가장 흔하고
  # 그게 정확히 막아야 하는 경우다. 로그인은 반드시 백엔드를 지나므로 여기서 본다.
  client:
    # **비어 있으면 게이트가 꺼진다.** 기본값이 빈 값인 이유: 이 코드가 배포되는
    # 순간 이미 사람들 손에 있는 빌드가 전부 막히면 안 된다. 최소 버전을 올리는
    # **시점이 곧 구버전 차단 시점**이고 그 판단은 사람이 한다.
    #
    # **개발 서버(`/dev`)는 비워 둔다.** 에디터 실행과 dev·qa 빌드는 `vX.Y.Z` 모양이
    # 아니라(=UNKNOWN) 켜는 순간 팀이 전부 막힌다.
    #
    # 재배포 없이 바꾼다 — `CLIENT_MIN_VERSION` 을 고치고 컨테이너만 다시 띄운다.
    min-version: ${CLIENT_MIN_VERSION:}
    # 거절 화면에 그대로 띄운다. 사유만 주면 사용자는 무엇을 해야 하는지 모른다.
    download-url: ${CLIENT_DOWNLOAD_URL:https://j15b202.p.ssafy.io/play/}

